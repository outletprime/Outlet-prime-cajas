<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OP Live">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="icon" type="image/png" href="icons/app-192.png">
<title>Outlet Prime Live</title>
<style>
:root {
  --fondo: #f3f3f2; --superficie: #ffffff; --superficie-2: #e9e9e7; --texto: #141414; --texto-2: #66645f;
  --borde: #dcdbd8; --primario: #111111; --primario-texto: #ffffff; --marca: #ce091e;
  --ok: #2f7d4f; --ok-suave: #e1f1e6; --aviso: #a86400; --aviso-suave: #fbeed6;
  --vencida: #b8322a; --vencida-suave: #f9e1de; --info: #2b5c9e; --info-suave: #e2ebf7;
  --wa-fondo: #efe7dd; --wa-in: #ffffff; --wa-out: #d9fdd3;
  --sombra: 0 1px 2px rgba(40,30,20,.06), 0 2px 8px rgba(40,30,20,.05);
  --radio: 14px; --sup: env(safe-area-inset-top, 0px); --inf: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0e0e0e; --superficie: #1b1b1b; --superficie-2: #272727; --texto: #f1f1ef; --texto-2: #a3a19c;
    --borde: #333333; --primario: #f1f1ef; --primario-texto: #111111; --marca: #e5263a;
    --ok: #63c08a; --ok-suave: #1d3326; --aviso: #e7a948; --aviso-suave: #3a2d17;
    --vencida: #f0776d; --vencida-suave: #3d2120; --info: #8db4ea; --info-suave: #1d2a3d;
    --wa-fondo: #0b141a; --wa-in: #202c33; --wa-out: #005c4b; --sombra: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #0e0e0e; --superficie: #1b1b1b; --superficie-2: #272727; --texto: #f1f1ef; --texto-2: #a3a19c;
  --borde: #333333; --primario: #f1f1ef; --primario-texto: #111111; --marca: #e5263a;
  --ok: #63c08a; --ok-suave: #1d3326; --aviso: #e7a948; --aviso-suave: #3a2d17;
  --vencida: #f0776d; --vencida-suave: #3d2120; --info: #8db4ea; --info-suave: #1d2a3d;
  --wa-fondo: #0b141a; --wa-in: #202c33; --wa-out: #005c4b; --sombra: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior-y: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--sup); z-index: 25; background: #000; }
svg { width: 22px; height: 22px; flex: none; }
h1, h2, h3, p { margin: 0; }
small, .nota { color: var(--texto-2); font-size: 13px; }
.nota { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

.barra-sup { position: sticky; top: var(--sup); z-index: 20; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #000; color: #fff; border-bottom: 3px solid var(--marca); }
.barra-sup img { height: 36px; width: auto; display: block; }
.barra-sup h1 { flex: 1; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-icono { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: #fff; text-decoration: none; }
.btn-icono:active { background: rgba(255,255,255,.15); }
#vista { padding: 14px 16px calc(var(--inf) + 96px); max-width: 760px; margin: 0 auto; display: grid; gap: 12px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(var(--inf) + 6px); background: color-mix(in srgb, var(--superficie) 94%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--borde); }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border: 0; background: none; color: var(--texto-2); font: 500 11px/1.2 inherit; font-family: inherit; cursor: pointer; position: relative; }
.tabs button[aria-current="page"] { color: var(--marca); }
.tabs .punto { position: absolute; top: 0; right: calc(50% - 20px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--marca); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 0; font: inherit; font-weight: 600; cursor: pointer; background: var(--superficie-2); color: var(--texto); text-decoration: none; text-align: center; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primario { background: var(--primario); color: var(--primario-texto); }
.btn-marca { background: var(--marca); color: #fff; }
.btn-secundario { background: var(--superficie); color: var(--texto); border: 1px solid var(--borde); }
.btn-peligro { background: var(--vencida); color: #fff; }
.btn-grande { width: 100%; min-height: 54px; font-size: 17px; }
.btn-mini { min-height: 36px; padding: 0 12px; font-size: 14px; }
.fila-botones { display: flex; flex-wrap: wrap; gap: 8px; }

.tarjeta { padding: 14px; border-radius: var(--radio); background: var(--superficie); border: 1px solid var(--borde); box-shadow: var(--sombra); display: grid; gap: 10px; }
.seccion { font-size: 13px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--texto-2); margin-top: 10px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radio); font-size: 15px; }
.banner svg { margin-top: 1px; }
.banner-aviso { background: var(--aviso-suave); color: var(--aviso); }
.banner-info { background: var(--info-suave); color: var(--info); }
.banner-ok { background: var(--ok-suave); color: var(--ok); }
.banner a { color: inherit; font-weight: 700; }
.chip { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--superficie-2); color: var(--texto-2); white-space: nowrap; }
.chip-ok { background: var(--ok-suave); color: var(--ok); }
.chip-aviso { background: var(--aviso-suave); color: var(--aviso); }
.chip-vencida { background: var(--vencida-suave); color: var(--vencida); }
.chip-info { background: var(--info-suave); color: var(--info); }
.chip-vivo { background: var(--marca); color: #fff; }
.punto-vivo { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #fff; margin-right: 5px; vertical-align: 1px; animation: parpadeo 1.4s infinite; }
@keyframes parpadeo { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .punto-vivo { animation: none; } }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { padding: 10px 12px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--borde); }
.kpi small { display: block; }
.kpi b { font-size: 22px; font-variant-numeric: tabular-nums; }

.feed { display: grid; gap: 6px; }
.feed-fila { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--borde); }
.feed-fila > :last-child { grid-row: 1 / span 2; grid-column: 2; }
.feed-fila.espera { background: transparent; border-style: dashed; }
.feed-num { font-size: 26px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
.feed-num .flecha { color: var(--texto-2); font-weight: 500; margin: 0 6px; }
.feed-num .cas { color: var(--marca); }
.feed-quien { min-width: 0; font-size: 14px; color: var(--texto-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-quien b { color: var(--texto); }
.nuevo { animation: entra .6s ease-out; }
@keyframes entra { from { background: var(--ok-suave); } }

.filtros { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.filtros::-webkit-scrollbar { display: none; }
.filtro { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--superficie); border: 1px solid var(--borde); color: var(--texto); font: 500 14px/1.2 inherit; font-family: inherit; cursor: pointer; }
.filtro b { color: var(--texto-2); margin-left: 3px; }
.filtro[aria-pressed="true"] { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
.filtro[aria-pressed="true"] b { color: inherit; opacity: .7; }

.casillero { display: grid; grid-template-columns: 86px 1fr; gap: 12px; padding: 12px; border-radius: var(--radio); background: var(--superficie); border: 1px solid var(--borde); border-left: 5px solid var(--borde); }
.casillero.e-por_pagar, .casillero.e-pago_incompleto { border-left-color: var(--aviso); }
.casillero.e-pagada { border-left-color: var(--ok); }
.casillero.e-vencida, .casillero.e-cancelada, .casillero.sin-caja { border-left-color: var(--vencida); }
.casillero.e-abierta { border-left-color: var(--info); }
/* Revisión física: amarillo = faltan prendas · verde = pedido completo */
.casillero.rev-incompleto, .acomodo-fila.rev-incompleto { background: var(--aviso-suave); border-color: var(--aviso); border-left: 5px solid var(--aviso); border-style: solid; }
.casillero.rev-completo, .acomodo-fila.rev-completo { background: var(--ok-suave); border-color: var(--ok); border-left: 5px solid var(--ok); border-style: solid; }
.rev-incompleto .chip, .rev-completo .chip { background: var(--superficie); font-weight: 700; }
.cas-id { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.cas-id small { display: block; font-size: 12px; font-weight: 500; margin-top: 4px; }
.cas-cuerpo { display: grid; gap: 6px; min-width: 0; }
.cas-cab { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; align-items: baseline; }
.cas-cab b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.piezas { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .3px; }
.paso { font-size: 15px; }
.paso b { color: var(--marca); }

label { display: grid; gap: 5px; font-size: 14px; font-weight: 600; color: var(--texto-2); }
input, select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); font: inherit; font-size: 16px; font-weight: 400; }
textarea { resize: vertical; min-height: 80px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primario); outline-offset: 0; border-color: transparent; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.formulario { display: grid; gap: 12px; }

.chat { display: grid; gap: 6px; padding: 12px; border-radius: var(--radio); background: var(--wa-fondo); min-height: 240px; max-height: 55vh; overflow-y: auto; align-content: start; }
.burbuja { max-width: 85%; min-width: 84px; padding: 7px 10px 18px; border-radius: 10px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.burbuja time { position: absolute; right: 8px; bottom: 3px; font-size: 11px; color: var(--texto-2); }
.burbuja.entrada { justify-self: end; background: var(--wa-out); border-top-right-radius: 2px; }
.burbuja.salida { justify-self: start; background: var(--wa-in); border-top-left-radius: 2px; }
.chat-vacio { color: var(--texto-2); text-align: center; padding: 40px 10px; font-size: 14px; }
.enviar { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.atajos { display: flex; gap: 6px; flex-wrap: wrap; }

.lista-simple { display: grid; gap: 6px; }
.lista-simple > div { padding: 10px 12px; border-radius: 10px; background: var(--superficie-2); font-size: 14px; }
.estados { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .estados { grid-template-columns: repeat(2, 1fr); } }

.vacio { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 34px 16px; color: var(--texto-2); }
.vacio svg { width: 40px; height: 40px; }
.vacio h2 { color: var(--texto); font-size: 19px; }
.cargando { display: grid; place-items: center; padding: 80px 0; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--borde); border-top-color: var(--marca); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 16px; right: 16px; top: calc(var(--sup) + 12px); z-index: 100; margin: 0 auto; max-width: 480px; padding: 13px 16px; border-radius: 12px; background: var(--texto); color: var(--fondo); font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); transform: translateY(-20px); opacity: 0; transition: .25s; }
.toast.visible { transform: none; opacity: 1; }
.toast-error { background: var(--vencida); color: #fff; }
.modal-fondo { position: fixed; inset: 0; z-index: 75; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); }
.modal { width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; padding: 20px 18px calc(var(--inf) + 16px); border-radius: 20px 20px 0 0; background: var(--superficie); display: grid; gap: 12px; }
@media (min-width: 600px) { .modal-fondo { align-items: center; } .modal { border-radius: 20px; } }
.modal h2 { font-size: 19px; }
.modal-botones { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; margin-top: 6px; }

.segmentos { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--superficie-2); }
.segmentos button { min-height: 40px; border: 0; border-radius: 9px; background: none; color: var(--texto-2); font: 600 14px/1.2 inherit; font-family: inherit; cursor: pointer; }
.segmentos button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: var(--sombra); }
.punto-rojo { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--marca); margin-right: 6px; vertical-align: 1px; }
.chip-prime { background: #1d1d1d; color: #f5c94c; }
.plegable > summary { cursor: pointer; color: var(--texto-2); font-weight: 600; padding: 8px 0; }
.lista-invitadas { display: grid; gap: 8px; }
.invitada { display: grid; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--superficie-2); }
.invitada:not(.si) { grid-template-columns: 1fr auto; align-items: center; }
.invitada b, .invitada small { display: block; overflow-wrap: anywhere; }
.invitada .codigo { display: inline; font-family: ui-monospace, Menlo, monospace; letter-spacing: 1px; color: var(--texto); }
.invitada .ok { color: var(--ok); font-weight: 600; }
.btn-wa { background: #25d366; color: #0b3d1f; }
.video-prime { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radio); overflow: hidden; background: #000; }
.video-prime iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.capturar { cursor: pointer; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ptile { border-radius: 12px; overflow: hidden; background: var(--superficie); border: 1px solid var(--borde); display: grid; align-content: start; }
.ptile img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: var(--superficie-2); display: block; }
.ptile-in { padding: 8px 10px 10px; display: grid; gap: 6px; }
.ptile-in .chip { justify-self: start; }
.cas-mini { color: var(--marca); }
.foto-previa { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 12px; background: #000; }
.tallas { display: flex; flex-wrap: wrap; gap: 6px; }
.talla { min-width: 44px; min-height: 40px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); font: 600 14px/1 inherit; font-family: inherit; cursor: pointer; }
.talla[aria-pressed="true"] { background: var(--texto); color: var(--fondo); border-color: var(--texto); }

.chip-monitor { background: #2a2a2a; color: #f5c94c; }
.sin-borde { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 12px; }
.sin-borde[disabled] input, .sin-borde[disabled] textarea { opacity: .7; }
.miembro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--superficie-2); }
.miembro b, .miembro small { display: block; overflow-wrap: anywhere; }
.miembro select { min-height: 40px; width: auto; max-width: 100%; }
/* En celular el correo va arriba, completo, y el nivel abajo a todo lo ancho */
@media (max-width: 640px) { #equipo .miembro { grid-template-columns: minmax(0, 1fr); } #equipo .miembro select { width: 100%; } }
.miembro.pendiente { outline: 2px solid var(--aviso); }

/* Comentarios del live: pide DM, agente, pantalla host */
.dm { display: grid; gap: 8px; padding: 12px 14px; border-radius: var(--radio); background: var(--superficie); border: 2px solid var(--marca); }
.dm.pedido { border-color: var(--aviso); }
.dm-cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dm-cab b { font-size: 18px; overflow-wrap: anywhere; }
.dm-tiempo { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 800; color: var(--marca); }
.dm .fila-botones { gap: 6px; }
.dm .banner { padding: 8px 10px; align-items: center; flex-wrap: wrap; }
.agente { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.chip-red { background: #000; color: #fff; }
.origen { font-size: 12px; color: var(--texto-2); }
details.tarjeta > summary { cursor: pointer; font-weight: 700; }
body.host .barra-sup, body.host .tabs { display: none; }
body.host #vista { max-width: none; padding: calc(var(--sup) + 14px) 20px 24px; }
.host-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 900px) { .host-grid { grid-template-columns: 1fr; } }
.host-grid section { display: grid; gap: 10px; }
.host-grid h2 { font-size: 26px; margin: 0; }
.host-dm { padding: 14px 18px; border-radius: 16px; background: var(--marca); color: #fff; display: grid; gap: 2px; border: 0; text-align: left; font: inherit; }
.host-dm.pedido { background: #6b4a00; }
.host-dm b { font-size: clamp(28px, 4vw, 46px); line-height: 1.1; overflow-wrap: anywhere; }
.host-dm span { font-size: clamp(17px, 2vw, 22px); }
.host-ap { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; border-radius: 14px; background: var(--superficie); border: 1px solid var(--borde); font-size: clamp(20px, 2.6vw, 30px); }
.host-ap .cas { color: var(--marca); font-weight: 800; }
.host-ap small { font-size: .6em; color: var(--texto-2); }

.acomodo { display: grid; gap: 8px; }
.acomodo-fila { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--superficie); border: 1px solid var(--borde); }
.acomodo-fila.regresar { border-style: dashed; }
.acomodo-fila small { display: block; color: var(--texto-2); }
.acomodo-num, .acomodo-fila b { font-size: 24px; font-variant-numeric: tabular-nums; }
.acomodo-cas { color: var(--marca); }
.acomodo-ok { min-width: 64px; min-height: 52px; border-radius: 14px; }
.acomodo-ok svg { width: 26px; height: 26px; }
.acomodo-hecha { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.rev-resumen { font-size: 16px; }
.rev-lista { display: grid; gap: 8px; margin: 10px 0; }
.rev-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--borde); background: var(--superficie); }
.rev-fila.rev-encontrada { background: var(--ok-suave); border-color: transparent; }
.rev-fila.rev-no_encontrada { background: var(--vencida-suave); border-color: transparent; }
.rev-fila.rev-no_vendible { background: var(--aviso-suave); border-color: transparent; }
.rev-clave { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.rev-cas { color: var(--marca); font-size: 18px; }
.rev-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rev-btns .btn { white-space: normal; line-height: 1.15; padding-left: 8px; padding-right: 8px; }
.btn.rev-si { background: var(--ok); color: #fff; }
.btn.rev-no { background: var(--vencida); color: #fff; }

<body>
<div id="app"><div class="cargando"><div class="spinner"></div></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
/* Panel del live · Outlet Prime
 * Lee y escribe en la misma base de Supabase que la app de Cajas.
 * Toda la lógica (apartar, casilleros, cobros, caja fija) está en la base de datos;
 * este panel solo muestra y llama a esas funciones. */
const CFG = window.APP_CONFIG || {};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDinero = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
const dinero = n => fmtDinero.format(Number(n) || 0);
/* Claves de prenda: A1 … ZY98 (sin O, I, L, Ñ; dos letras distintas; sin 11, 22 … 88 ni 99).
   Igual que clave_a_num / num_a_clave en la base. Cada clave es un número interno 1..52371. */
const LETRAS_CLAVE = 'ABCDEFGHJKMNPQRSTUVWXYZ';
function claveANum(texto) {
  const m = String(texto ?? '').toUpperCase().replace(/[\s#-]/g, '').match(/^([A-Z]{1,2})([0-9]{1,2})$/);
  if (!m) return null;
  const n = parseInt(m[2], 10);
  if (n < 1 || n > 98 || n % 11 === 0) return null;
  const a = LETRAS_CLAVE.indexOf(m[1][0]);
  if (a < 0) return null;
  if (m[1].length === 1) return a * 99 + n;
  let b = LETRAS_CLAVE.indexOf(m[1][1]);
  if (b < 0 || b === a) return null;
  if (b > a) b -= 1;
  return 2277 + (a * 22 + b) * 99 + n;
}
function numAClave(p) {
  p = Number(p);
  if (!Number.isInteger(p) || p < 1 || p > 52371) return null;
  if (p <= 2277) return LETRAS_CLAVE[Math.floor((p - 1) / 99)] + ((p - 1) % 99 + 1);
  let k = p - 2278;
  const n = (k % 99) + 1;
  k = Math.floor(k / 99);
  const a = Math.floor(k / 22);
  let b = k % 22;
  if (b >= a) b += 1;
  return LETRAS_CLAVE[a] + LETRAS_CLAVE[b] + n;
}
// Claves escritas en un texto ("A23 ab7 AB-12") → números internos; también avisa las que no existen
function clavesDe(t) {
  const txt = String(t ?? '');
  const nums = [], malas = [];
  for (const m of txt.matchAll(/(?<![\p{L}\p{N}_])([A-Za-z]{1,2})[\s-]?([0-9]{1,3})(?![\p{L}\p{N}_])/gu)) {
    const n = claveANum(m[1] + m[2]);
    if (n) { if (!nums.includes(n)) nums.push(n); } else malas.push((m[1] + m[2]).toUpperCase());
  }
  return { nums, malas };
}
const num4 = n => numAClave(n) || String(n).padStart(4, '0');
const hora = v => v ? new Date(v).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }) : '';
const horaSeg = v => v ? new Date(v).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit', second: '2-digit' }) : '';
const fechaHora = v => v ? new Date(v).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
const folio = f => 'OP-' + String(f).padStart(3, '0');
const telBonito = t => { const d = String(t || ''); return d.startsWith('00') ? 'prueba ' + d.slice(-2) : d.replace(/(\d{2})(\d{4})(\d{4})/, '$1 $2 $3'); };

const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = {
  vivo: svg('<circle cx="12" cy="12" r="2.5"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/>'),
  casilleros: svg('<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>'),
  prendas: svg('<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'),
  chat: svg('<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.5A8.4 8.4 0 1 1 21 11.5z"/>'),
  ajustes: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  cajas: svg('<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>'),
  alerta: svg('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
  info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'),
  ok: svg('<path d="M20 6 9 17l-5-5"/>'),
  enviar: svg('<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>'),
  ayuda: svg('<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.5A8.4 8.4 0 1 1 21 11.5z"/><path d="M9.8 9.3a2.4 2.4 0 0 1 4.6.9c0 1.5-2.3 1.9-2.3 3.3M12.1 16.3h.01"/>'),
};

/* ---------- Avisos y ventanas ---------- */
function toast(msg, tipo = 'ok') {
  const t = document.createElement('div');
  t.className = `toast toast-${tipo}`;
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('visible'));
  setTimeout(() => { t.classList.remove('visible'); setTimeout(() => t.remove(), 300); }, tipo === 'error' ? 5500 : 3000);
}
function modal({ titulo, html, botones, alAbrir }) {
  return new Promise(resolve => {
    const fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <h2>${esc(titulo)}</h2><div>${html || ''}</div>
      <div class="modal-botones">${botones.map((b, i) => `<button type="button" class="btn ${b.clase || (i === botones.length - 1 ? 'btn-primario' : 'btn-secundario')}" data-i="${i}">${esc(b.texto)}</button>`).join('')}</div></div>`;
    const cerrar = v => { fondo.remove(); resolve(v); };
    fondo.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b) { const def = botones[+b.dataset.i]; const v = typeof def.valor === 'function' ? def.valor(fondo) : def.valor; if (v !== undefined) cerrar(v); }
      else if (e.target === fondo) cerrar(null);
    });
    document.body.appendChild(fondo);
    alAbrir && alAbrir(fondo, cerrar);
  });
}
const confirmar = (titulo, html, si = 'Sí, continuar', peligro = false) =>
  modal({ titulo, html, botones: [{ texto: 'Cancelar', valor: false }, { texto: si, valor: true, clase: peligro ? 'btn-peligro' : 'btn-primario' }] }).then(Boolean);

function traducirError(err) {
  const m = (err && (err.message || err.error_description)) || String(err);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sin conexión a internet. Revisa la señal e intenta de nuevo.';
  if (/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/JWT|session/i.test(m)) return 'Tu sesión expiró. Vuelve a entrar.';
  if (/live_config_check/.test(m)) return 'Las horas deben ir en orden: recordatorio, luego límite de pago, luego liberar.';
  if (/lives_uno_activo/.test(m)) return 'Ya hay un live en curso.';
  if (/row-level security|permission denied|coerce the result to a single JSON/i.test(m)) return 'Tu nivel de acceso no permite hacer esto.';
  if (/does not exist|schema cache/i.test(m)) return 'Falta instalar el sistema de lives en la base de datos.';
  if (/Registration failed|push service|applicationServerKey/i.test(m)) return 'El teléfono no pudo registrarse para recibir avisos. Revisa que las notificaciones estén permitidas para el panel y vuelve a intentar.';
  return m;
}
let ocupado = false;
async function accion(fn, okMsg) {
  if (ocupado) return null;
  ocupado = true;
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg); return r ?? true; }
  catch (e) { console.error(e); toast(traducirError(e), 'error'); return null; }
  finally { ocupado = false; }
}

/* ---------- Nivel de acceso ---------- */
let ROL = null;
const NIVELES = { duena: 'Dueña', supervisor: 'Supervisor · ver y registrar clientas', operacion: 'Operación', live: 'Operación live · acomodo', presentadora: 'Presentadora · solo avisos de DM', resurtido: 'Resurtido · solo reponer racks' };
const puede = {
  operar: () => ROL === 'duena' || ROL === 'operacion',
  duena: () => ROL === 'duena',
  acomodar: () => ['duena', 'operacion', 'live'].includes(ROL),
  // Confirmar que un pedido está completo en su casillero (después de cerrar el live)
  confirmarPedido: () => ['duena', 'operacion', 'live'].includes(ROL),
  // Supervisor solo cambia esto: ligar a una clienta que mandó su WhatsApp por DM
  ligar: () => ['duena', 'operacion', 'supervisor'].includes(ROL),
  // Ver cuántas prendas pagadas hay que reponer en la sala (el nivel Resurtido solo ve esto)
  verResurtido: () => ['duena', 'operacion', 'supervisor', 'resurtido'].includes(ROL),
  // Generar el PDF de etiquetas con las claves que siguen (lo imprime el supervisor)
  etiquetas: () => ['duena', 'supervisor'].includes(ROL),
  // Agregar clientas desde Ajustes con los datos que mandaron por DM
  agregarClienta: () => ['duena', 'supervisor'].includes(ROL),
};

/* ---------- Datos ---------- */
const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
let usuario = null;
async function q(consulta) { const { data, error } = await consulta; if (error) throw error; return data; }
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }

const D = { live: null, prime: null, primeProg: [], cfg: null, feed: [], tablero: [], vistos: new Set(), primeraCarga: true, dms: [], agente: [], cargadoEn: Date.now() };
async function cargar() {
  const [lives, cfg, tablero] = await Promise.all([
    q(sb.from('lives').select('*').in('estado', ['activo', 'programado']).order('programado_para', { ascending: true }).limit(50)),
    q(sb.from('live_config').select('*').limit(1)),
    q(sb.from('live_tablero').select('*').or('casillero_liberado_en.is.null,estado.in.(por_pagar,pago_incompleto)').order('folio', { ascending: true }).limit(1000)),
  ]);
  D.live = lives.find(l => l.tipo === 'redes' && l.estado === 'activo') || null;
  D.prime = lives.find(l => l.tipo === 'prime' && l.estado === 'activo') || null;
  D.primeProg = lives.filter(l => l.tipo === 'prime' && l.estado === 'programado');
  D.cfg = cfg[0] || {};
  D.tablero = tablero;
  D.feed = D.live
    ? await q(sb.from('live_feed').select('*').eq('live_id', D.live.id).in('estado', ['apartada', 'espera', 'pagada']).order('creado_en', { ascending: false }).limit(500))
    : [];
  if (TIENE_COMENTARIOS) {
    [D.dms, D.agente] = await Promise.all([
      q(sb.from('live_dm_tablero').select('*').eq('estado', 'esperando').order('primer_comentario_en', { ascending: true }).limit(100)),
      q(sb.from('live_agente').select('*').limit(20)),
    ]);
    D.cargadoEn = Date.now();
    const { count } = await sb.from('live_acomodo').select('id', { head: true, count: 'exact' }).neq('tarea', 'hecho');
    D.porAcomodar = count || 0;
  }
}

/* ---------- Comentarios del live (agente con IA) ---------- */
let TIENE_COMENTARIOS = false;   // se activa cuando la base ya tiene 20261116090000_comentarios_live.sql
const RED = { tiktok: 'TikTok', facebook: 'Facebook', instagram: 'Instagram', youtube: 'YouTube', whatsapp: 'WhatsApp', simulador: 'Simulador', otra: 'Otra' };
const ESTADO_AG = { conectado: 'leyendo', esperando: 'esperando live', error: 'error', apagado: 'apagado' };
const mmss = seg => { const s = Math.max(0, Math.round(seg)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const nombreCorto = n => String(n || '').split(' ').slice(0, 2).join(' ');
// Mensaje para contestarle a una clienta nueva por DM: solo se le pide su nombre y apellido
const MENSAJE_DM = '¡Hola {usuario}! 💕 Para apartarte tus prendas mándanos por aquí tu nombre y por lo menos un apellido. Después de eso, todo lo que comentes en el live se te aparta solo.';
function textoDM(d) {
  return String(D.cfg.mensaje_dm || MENSAJE_DM)
    .replaceAll('{whatsapp}', (D.cfg.whatsapp_numero || '').trim() || '(número del bot)')
    .replaceAll('{usuario}', d && d.usuario ? '@' + d.usuario : 'tu usuario');
}
function htmlAgente() {
  if (!TIENE_COMENTARIOS) return '';
  const prog = D.agente.find(a => a.red === 'agente');
  const vivo = prog && prog.estado !== 'apagado' && Date.now() - new Date(prog.actualizado_en) < 60000;
  if (!vivo) return `<div class="banner banner-aviso">${IC.alerta}<span><b>El agente que lee los comentarios no está encendido.</b> Ábrelo en la computadora de la tienda. Mientras tanto, captura a mano (abajo); las clientas también pueden apartar por WhatsApp.</span></div>`;
  const redes = D.agente.filter(a => a.red !== 'agente');
  const errores = redes.filter(a => a.estado === 'error');
  return `<div class="agente"><b>Agente:</b>${redes.map(a => `<span class="chip ${a.estado === 'conectado' ? 'chip-ok' : a.estado === 'error' ? 'chip-vencida' : 'chip-aviso'}" title="${esc(a.detalle || '')}">${esc(RED[a.red] || a.red)} · ${esc(ESTADO_AG[a.estado] || a.estado)}</span>`).join('')}
    ${prog.detalle ? `<small>${esc(prog.detalle)}</small>` : ''}</div>
    ${errores.map(a => `<div class="banner banner-aviso">${IC.alerta}<span>${esc(a.detalle || (RED[a.red] || a.red) + ': error')}. Captura a mano mientras se resuelve.</span></div>`).join('')}`;
}
function tarjetaDM(d) {
  const fin = D.cargadoEn + d.segundos * 1000;
  const pidio = [];
  if (d.provisionales.length) pidio.push(`pidió <b>${d.provisionales.map(num4).join(', ')}</b>`);
  if (d.en_espera.length) pidio.push(`en espera de ${d.en_espera.map(num4).join(', ')}`);
  return `<div class="dm${d.pedido_en ? ' pedido' : ''}">
    <div class="dm-cab"><span class="chip chip-red">${esc(RED[d.red] || d.red)}</span><b>@${esc(d.usuario)}</b>${d.pedido_en ? '<span class="chip chip-aviso">DM pedido</span>' : ''}<span class="dm-tiempo" data-fin="${fin}">${mmss(d.segundos)}</span></div>
    <div>${pidio.join(' · ') || 'Sin prendas'}${d.provisionales.length ? ' <small>(deja la prenda en la charola de pendientes)</small>' : ''}</div>

function cargarJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
    s.onload = () => ok(window.jspdf.jsPDF);
    s.onerror = () => { s.parentNode && s.parentNode.removeChild(s); mal(new Error('No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.')); };
    document.head.appendChild(s);
  });
}
// Dibuja las etiquetas: logo arriba, la clave lo más grande que quepa y la indicación para la clienta
function pdfEtiquetas(claves, jsPDF, logo) {
  const doc = new jsPDF({ unit: 'pt', format: 'letter', compress: true });
  const ANCHO = 288, ALTO = 240, IZQ = 11.25, SUP = 36, ENTRE = 13.5, LOGO_W = 124, LOGO_H = 62;
  claves.forEach((clave, i) => {
    const k = i % 6;
    if (i && k === 0) doc.addPage('letter');
    const x = IZQ + (k % 2) * (ANCHO + ENTRE), y = SUP + Math.floor(k / 2) * ALTO, cx = x + ANCHO / 2;
    doc.addImage(logo, 'PNG', cx - LOGO_W / 2, y + 14, LOGO_W, LOGO_H, 'logo', 'FAST');
    let tam = 104;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(tam);
    while (doc.getTextWidth(clave) > ANCHO - 44) doc.setFontSize(--tam);
    const libre = ALTO - 14 - LOGO_H - 12 - 36 - 0.718 * tam;   // espacio que sobra entre el logo y la indicación
    doc.setTextColor(0);
    doc.text(clave, cx, y + ALTO - 36 - libre / 2, { align: 'center' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(64);
    doc.text('Comenta esta clave en el live para apartarla', cx, y + ALTO - 18, { align: 'center' });
  });
  return doc.output('blob');
}
// Nota de cobro en PDF para mandarla a la clienta: logo, sus prendas, el total y los datos para transferir.
// Página angosta y tan larga como haga falta, para que se lea bien en el celular.
function pdfNota(n, jsPDF, logo) {
  const W = 420, M = 30, ROJO = [206, 9, 30], GRIS = 95;
  const zona = { timeZone: 'America/Mexico_City' };
  const fecha = t => new Date(t).toLocaleDateString('es-MX', { ...zona, day: 'numeric', month: 'long' });
  const horaTxt = t => new Date(t).toLocaleTimeString('es-MX', { ...zona, hour: 'numeric', minute: '2-digit', hour12: true })
    .replace(/\s?a\.?\s?m\.?/i, ' a.m.').replace(/\s?p\.?\s?m\.?/i, ' p.m.');
  const cuando = t => `${horaTxt(t)} del ${fecha(t)}`;
  const pesos = v => '$' + Number(v || 0).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const clabe = String(n.clabe || '').replace(/\D/g, '');
  const clabeTxt = clabe.length === 18 ? `${clabe.slice(0, 3)} ${clabe.slice(3, 6)} ${clabe.slice(6, 17)} ${clabe.slice(17)}` : clabe;
  const ps = n.piezas || [];
  const cols = ps.length > 8 ? 2 : 1, filas = Math.ceil(ps.length / cols), FILA = 23;
  const falta = Math.max(0, Number(n.total) - Number(n.pagado || 0));
  const datos = [['Banco', n.banco], ['A nombre de', n.titular]].filter(d => d[1]);

  // Alto de la página según lo que lleva
  const altoPrendas = 30 + filas * FILA;
  const altoDatos = clabe ? 58 + datos.length * 30 + 52 : 50;
  const H = 238 + altoPrendas + 22 + (Number(n.pagado) > 0 ? 82 : 64) + 20 + altoDatos + 20 + 76 + 40;

  doc.setFont('helvetica', 'normal'); doc.setTextColor(GRIS); doc.text('PRECIO', W - M, y, { align: 'right' });

  const anchoCol = (W - 2 * M - (cols - 1) * 24) / cols;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(13.5); doc.setTextColor(20); doc.text(String(p.clave), x, yy);

    doc.setDrawColor(232); doc.setLineWidth(0.6); doc.line(x, yy + 8, x + anchoCol, yy + 8);
  });
  y += altoPrendas;

  // Total
  y += 14;
  if (Number(n.pagado) > 0) {
    doc.setFontSize(11.5); doc.setTextColor(60);
    doc.text('Total del pedido', M, y + 2); doc.text(pesos(n.total), W - M, y + 2, { align: 'right' });
    doc.text('Ya pagaste', M, y + 20); doc.text('- ' + pesos(n.pagado), W - M, y + 20, { align: 'right' });
    y += 30;
  }
  doc.setFillColor(...ROJO); doc.roundedRect(M, y, W - 2 * M, 52, 8, 8, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text(Number(n.pagado) > 0 ? 'FALTA POR PAGAR' : 'TOTAL A PAGAR', M + 16, y + 31);
  doc.setFontSize(25); doc.text(pesos(falta), W - M - 16, y + 35, { align: 'right' });
  y += 52 + 22;

  // Datos para transferir
  doc.setFillColor(244, 244, 242); doc.setDrawColor(222);
  doc.roundedRect(M, y, W - 2 * M, altoDatos, 8, 8, 'FD');
  let yd = y + 26;
  doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5);
  doc.text('DATOS PARA TRANSFERENCIA O DEPÓSITO', M + 16, yd);
  if (clabe) {
    yd += 28;
    datos.forEach(([k, v]) => {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(GRIS); doc.text(k.toUpperCase(), M + 16, yd - 11);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(20); doc.text(String(v), M + 16, yd + 4);
      yd += 30;
    });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(GRIS); doc.text('CLABE INTERBANCARIA', M + 16, yd - 11);
    doc.setFont('courier', 'bold'); doc.setFontSize(17); doc.setTextColor(20); doc.text(clabeTxt, M + 16, yd + 6);
    yd += 30;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(GRIS); doc.text('CONCEPTO (escríbelo al transferir)', M + 16, yd - 11);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...ROJO); doc.text(String(n.folio), M + 16, yd + 4);
  } else {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(60);
    doc.text('En un momento te mandamos los datos para pagar.', M + 16, yd + 18);
  }
  y += altoDatos + 20;

  // Plazo y comprobante
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(40);
  const avisos = [
    n.limite_pago ? `Paga antes de las ${cuando(n.limite_pago)}.` : '',
    n.liberar_en ? `Si no recibimos tu pago, a las ${cuando(n.liberar_en)} tus prendas se liberan para otras clientas.` : '',
    'Al pagar, mándanos tu comprobante por WhatsApp.',
  ].filter(Boolean).join(' ');
  doc.text(doc.splitTextToSize(avisos, W - 2 * M), M, y + 4, { lineHeightFactor: 1.35 });
  y += 76;

  linea(y);
  doc.setFontSize(10); doc.setTextColor(GRIS);
  centro('¡Gracias por tu compra! · Outlet Prime', y + 20);
  return doc;
}

      pintar();   // se vuelve a pintar aunque falle el PDF: si las claves ya quedaron anotadas, salen en "Lotes anteriores"
    };

}

/* ---------- Etiquetas de cajas de resguardo (Dueña y Supervisor) ----------
 * Mismo diseño que el PDF impreso: franja "CAJA DE RESGUARDO", el QR de la caja (el mismo que genera
 * la app de Cajas: abre esa caja al escanearlo), logo, la posición en grande y cuántas prendas caben.
 * Hojas Janel J-5164 (carta, 6 por hoja). Además, el mapa de todas las cajas en una hoja horizontal. */
function cargarQR() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  return new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    s.onload = () => ok(window.qrcode);
    s.onerror = () => { s.parentNode && s.parentNode.removeChild(s); mal(new Error('No se pudo cargar el generador de QR. Revisa tu conexión e intenta de nuevo.')); };
    document.head.appendChild(s);
  });
}
const partesCaja = id => { const m = /^([A-Z]+)(\d+)$/.exec(String(id || '').toUpperCase()); return m ? [m[1], +m[2]] : [String(id), 0]; };
const ordenCajas = (a, b) => { const [la, na] = partesCaja(a.id), [lb, nb] = partesCaja(b.id); return na - nb || la.localeCompare(lb); };
const textoQRCaja = id => new URL('./', location.href).href + '#/caja/' + encodeURIComponent(id);
const ROJO_PDF = [206, 9, 30];
// QR sólido: cada tramo de cuadritos negros de un renglón es un solo rectángulo (así no salen rayitas)
function qrPdf(doc, qrcode, texto, x, y, tam) {
  const q = qrcode(0, 'M');
  q.addData(texto);
  q.make();
  const n = q.getModuleCount(), borde = 2, m = tam / (n + 2 * borde);
  doc.setFillColor(255, 255, 255); doc.rect(x, y, tam, tam, 'F');
  doc.setFillColor(0, 0, 0);
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n;) {
      if (!q.isDark(r, c)) { c++; continue; }
      const ini = c;
      while (c < n && q.isDark(r, c)) c++;
      doc.rect(x + (borde + ini) * m, y + (borde + r) * m - 0.15, (c - ini) * m, m + 0.3, 'F');
    }
  }
}
function pdfCajas(cajas, jsPDF, qrcode, logo) {
  const doc = new jsPDF({ unit: 'pt', format: 'letter', compress: true });
  const ANCHO = 288, ALTO = 240, IZQ = 11.25, SUP = 36, ENTRE = 13.5, FRANJA = 30;
  cajas.forEach((caja, i) => {
    const k = i % 6;
    if (i && k === 0) doc.addPage('letter');
    const x = IZQ + (k % 2) * (ANCHO + ENTRE), t = SUP + Math.floor(k / 2) * ALTO, cx = x + ANCHO / 2;
    const [col, fila] = partesCaja(caja.id), cap = Number(caja.capacidad) || 30, grande = cap > 30;
    // Franja negra: lo que la distingue de un casillero del live (que también se llaman A1, B1…)
    doc.setFillColor(0, 0, 0); doc.rect(x + 10, t + 10, ANCHO - 20, FRANJA, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.setTextColor(255, 255, 255);
    doc.text('CAJA DE RESGUARDO', cx, t + 10 + FRANJA - 9.5, { align: 'center' });
    // QR a la izquierda
    const arriba = t + 10 + FRANJA + 4, abajo = t + ALTO - 34, tq = abajo - arriba;
    qrPdf(doc, qrcode, textoQRCaja(caja.id), x + 8, arriba, tq);
    // Logo y la posición en grande a la derecha
    const d0 = x + 8 + tq + 4, d1 = x + ANCHO - 12, dcx = (d0 + d1) / 2;
    doc.addImage(logo, 'PNG', dcx - 44, arriba + 6, 88, 44, 'logo', 'FAST');
    let tam = 96;
    doc.setFontSize(tam);
    while (doc.getTextWidth(caja.id) > d1 - d0 && tam > 30) doc.setFontSize(--tam);
    const techo = arriba + 6 + 44 + 4, alto = 0.718 * tam;
    doc.setTextColor(...ROJO_PDF);
    doc.text(caja.id, dcx, techo + (abajo - techo - alto) / 2 + alto, { align: 'center' });
    // Pie
    doc.setFont('helvetica', grande ? 'bold' : 'normal'); doc.setFontSize(11); doc.setTextColor(50, 50, 50);
    doc.text(`Columna ${col} · Fila ${fila} · Hasta ${cap} prendas`, cx, t + ALTO - 17, { align: 'center' });
  });
  return doc.output('blob');
}
function pdfMapaCajas(cajas, jsPDF, logo) {
  const doc = new jsPDF({ unit: 'pt', format: 'letter', orientation: 'landscape', compress: true });
  const W = 792, H = 612, M = 36;
  const cols = [...new Set(cajas.map(c => partesCaja(c.id)[0]))].sort();
  const filas = [...new Set(cajas.map(c => partesCaja(c.id)[1]))].sort((a, b) => a - b);
  const porId = new Map(cajas.map(c => [c.id, Number(c.capacidad) || 30]));
  const capCol = col => Math.max(...cajas.filter(c => partesCaja(c.id)[0] === col).map(c => porId.get(c.id)));
  // Resumen: qué columnas tienen qué capacidad (p. ej. "A a H: hasta 30 prendas · I y J: hasta 40 prendas")
  const grupos = [];
  cols.forEach(col => { const cap = capCol(col), g = grupos[grupos.length - 1]; if (g && g.cap === cap) g.cols.push(col); else grupos.push({ cap, cols: [col] }); });
  const nombreGrupo = g => g.cols.length === 1 ? g.cols[0] : g.cols.length === 2 ? g.cols.join(' y ') : `${g.cols[0]} a ${g.cols[g.cols.length - 1]}`;
  const capMin = Math.min(...grupos.map(g => g.cap));
  doc.setFillColor(255, 255, 255); doc.rect(0, 0, W, H, 'F');
  doc.addImage(logo, 'PNG', M, M, 100, 50, 'logo', 'FAST');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(25); doc.setTextColor(0, 0, 0);
  doc.text('Cajas de resguardo', M + 116, M + 24);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(12.5); doc.setTextColor(77, 77, 77);
  doc.text(`${cajas.length} cajas · ${grupos.map(g => `${nombreGrupo(g)}: hasta ${g.cap} prendas`).join(' · ')} · aquí se guardan las prendas ya pagadas`, M + 116, M + 44, { maxWidth: W - M * 2 - 116 });
  const izq = M + 30, arriba = M + 92, cw = (W - M - izq) / cols.length, ch = (H - M - 18 - arriba) / filas.length;
  cols.forEach((col, i) => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.setTextColor(...ROJO_PDF);
    doc.text(col, izq + cw * (i + 0.5), arriba - 8, { align: 'center' });
    if (capCol(col) > capMin) { doc.setFillColor(237, 237, 235); doc.roundedRect(izq + cw * i, arriba - 2, cw, ch * filas.length + 4, 6, 6, 'F'); }
  });
  filas.forEach((fila, j) => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.setTextColor(...ROJO_PDF);
    doc.text(String(fila), M + 11, arriba + ch * (j + 0.5) + 6, { align: 'center' });
    cols.forEach((col, i) => {
      const id = col + fila;
      if (!porId.has(id)) return;
      const cap = porId.get(id), x = izq + cw * i, y = arriba + ch * j;
      doc.setDrawColor(38, 38, 38); doc.setLineWidth(cap > capMin ? 2 : 1.1); doc.setFillColor(255, 255, 255);
      doc.roundedRect(x + 3.5, y + 3.5, cw - 7, ch - 7, 7, 7, 'FD');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(Math.min(30, cw * 0.42)); doc.setTextColor(0, 0, 0);
      doc.text(id, x + cw / 2, y + ch / 2 + 6, { align: 'center' });
      doc.setFont('helvetica', cap > capMin ? 'bold' : 'normal'); doc.setFontSize(9); doc.setTextColor(89, 89, 89);
      doc.text(`${cap} prendas`, x + cw / 2, y + ch - 12, { align: 'center' });
    });
  });
  const grandes = grupos.filter(g => g.cap > capMin);
  if (grandes.length) {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(89, 89, 89);
    doc.text(`Fondo gris: cajas grandes (${grandes.map(g => `${nombreGrupo(g)}: hasta ${g.cap} prendas`).join(' · ')}).`, izq, H - M + 4);
  }
  return doc.output('blob');
}

const archivoPdf = (blob, nombre) => { let archivo = null; try { archivo = new File([blob], nombre, { type: 'application/pdf' }); } catch (e) { /* solo descarga */ } return { url: URL.createObjectURL(blob), nombre, archivo }; };

/* ---------- Resurtido: prendas pagadas que hay que reponer en la sala ---------- */
async function vistaResurtir() {
  const [r, est] = await Promise.all([rpc('resurtido_estado'), ROL === 'resurtido' ? estadoAvisos() : null]);
  const n = r.pendientes;
  const prendas = c => `${c} ${c === 1 ? 'prenda' : 'prendas'}`;
  return `
    ${ROL === 'resurtido' ? '' : '<a href="#prendas" data-ir="prendas" class="nota">← Volver a Prendas</a>'}
    ${est && est.modo !== 'activo' ? `<div class="banner banner-aviso">${IC.alerta}<span>Tu celular todavía no recibe los avisos. <a href="#ajustes" data-ir="ajustes">Actívalos en Ajustes</a>.</span></div>` : ''}
    <div class="tarjeta resurtir-num">
      <small>Por resurtir en ${esc(r.sala)}</small>
      <b>${n}</b>
      <span>${n ? `${n === 1 ? 'prenda ya pagada que falta' : 'prendas ya pagadas que faltan'} por reponer` : 'Todo repuesto 👌'}</span>
      ${n && r.puede_marcar ? `<button type="button" class="btn btn-marca btn-grande" id="resurtir-todo" data-n="${n}">Ya resurtí ${n === 1 ? 'la prenda' : 'las ' + n}</button>
        ${n > 1 ? `<button type="button" class="btn btn-secundario" id="resurtir-parte" data-n="${n}">Solo resurtí una parte</button>` : ''}` : ''}
    </div>
    <p class="nota">Una prenda cuenta cuando su pago queda completo. Las apartadas que todavía no se pagan no aparecen aquí.${r.de_prueba ? ` Hay ${prendas(r.de_prueba)} de ensayo que no se ${r.de_prueba === 1 ? 'cuenta' : 'cuentan'}.` : ''}</p>
    <h3 class="seccion">Pagadas por live</h3>
    ${r.por_live.length ? `<div class="lista-simple">${r.por_live.map(l => `<div><b>${esc(l.titulo || 'Live')}</b> · ${prendas(l.prendas)}<br><small>${fechaHora(l.fecha)}</small></div>`).join('')}</div>` : '<p class="nota">Todavía no hay ventas pagadas.</p>'}
    <h3 class="seccion">Últimos resurtidos</h3>
    ${r.historial.length ? `<div class="lista-simple">${r.historial.map(h => `<div><b>${prendas(h.prendas)}</b> · ${esc(h.sala)}<br><small>${fechaHora(h.hecho_en)}${h.hecho_por ? ' · ' + esc(h.hecho_por) : ''}</small></div>`).join('')}</div>` : '<p class="nota">Aún no se ha anotado ningún resurtido.</p>'}`;
}
function conectarResurtir(raiz) {
  $$('[data-ir]', raiz).forEach(a => a.onclick = e => { e.preventDefault(); irA(a.dataset.ir); });
  const anotar = async cuantas => {
    if (await accion(() => rpc('resurtido_marcar', { p_prendas: cuantas, p_usuario: usuario.nombre }), 'Resurtido anotado')) pintar(true);
  };
  const todo = $('#resurtir-todo', raiz);
  if (todo) todo.onclick = async () => {
    const n = +todo.dataset.n;
    if (await confirmar(n === 1 ? '¿Ya repusiste la prenda?' : `¿Ya repusiste las ${n} prendas?`, '<p>Se anota a tu nombre y el contador vuelve a cero.</p>', 'Sí, ya quedó')) anotar(null);
  };
  const parte = $('#resurtir-parte', raiz);
  if (parte) parte.onclick = async () => {
    const max = +parte.dataset.n;
    const cuantas = await modal({
      titulo: '¿Cuántas prendas repusiste?',
      html: `<div class="formulario"><label>Prendas repuestas (de ${max})<input type="number" inputmode="numeric" min="1" max="${max}" id="resurtir-cuantas"></label><p class="nota">Las demás se quedan pendientes.</p></div>`,
      botones: [{ texto: 'Cancelar', valor: false }, { texto: 'Anotar', valor: f => {
        const v = Math.floor(+$('#resurtir-cuantas', f).value);
        if (!(v >= 1 && v <= max)) { toast(`Escribe un número entre 1 y ${max}.`, 'error'); return undefined; }
        return v;
      } }],
    });
    if (cuantas) anotar(cuantas);
  };
}

/* ---------- Presentadora: a quién pedirle DM ---------- */

    <span class="chip ${p.en_vivo ? 'chip-vivo' : ''}" style="justify-self:start">${p.en_vivo ? '<span class="punto-vivo"></span>EN VIVO' : 'SIN LIVE'}</span>

    ${p.dms.length ? p.dms.map(d => `<button type="button" class="host-dm${d.pedido_en ? ' pedido' : ''}" ${d.pedido_en ? '' : `data-pres-pedido="${d.id}"`}>

function conectarPresentadora(raiz) {
