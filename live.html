/* ---------- Estructura ---------- */
const VISTAS = [
  { id: 'dm', nombre: 'Pide DM', icono: IC.vivo },
  { id: 'resurtir', nombre: 'Resurtir', icono: IC.prendas },
  { id: 'vivo', nombre: 'En vivo', icono: IC.vivo },
  { id: 'casilleros', nombre: 'Casilleros', icono: IC.casilleros },
  { id: 'acomodo', nombre: 'Acomodo', icono: IC.ok },
  { id: 'prendas', nombre: 'Prendas', icono: IC.prendas },
  { id: 'whatsapp', nombre: 'WhatsApp', icono: IC.chat },
  { id: 'ajustes', nombre: 'Ajustes', icono: IC.ajustes },
];
const OCULTAS = ['host', 'resurtir'];   // vistas sin pestaña: pantalla host y, para quien no es de resurtido, el resurtido (se entra desde Prendas)
// Niveles que solo tienen su pantalla y Ajustes (para activar sus avisos)
const SOLO = { presentadora: ['dm', 'ajustes'], resurtido: ['resurtir', 'ajustes'] };
// "Operación live" no usa el simulador de WhatsApp; Acomodo necesita la base nueva
// La presentadora solo tiene "Pide DM" y Ajustes (para activar sus avisos)
const vistaVisible = v => SOLO[ROL] ? SOLO[ROL].includes(v.id)
  : !['dm', 'resurtir'].includes(v.id) && !(v.id === 'whatsapp' && ROL === 'live') && !(v.id === 'acomodo' && !TIENE_COMENTARIOS);
const existeVista = v => VISTAS.some(x => x.id === v) || OCULTAS.includes(v);
let vista = (location.hash.replace('#', '') || 'vivo');
if (!existeVista(vista)) vista = 'vivo';

function montar() {
  $('#app').innerHTML = `
    <header class="barra-sup">
      <img src="icons/logo-oscuro.png" alt="Outlet Prime">
      <h1 id="titulo">Live</h1>
      ${ROL === 'supervisor' ? '<span class="chip chip-monitor">Monitor</span>' : ROL === 'operacion' ? '<span class="chip chip-monitor">Operación</span>' : ROL === 'live' ? '<span class="chip chip-monitor">Acomodo</span>' : ROL === 'resurtido' ? '<span class="chip chip-monitor">Resurtido</span>' : ROL === 'presentadora' ? '<span class="chip chip-monitor">Presentadora</span>' : ''}
      ${['live', 'presentadora', 'resurtido'].includes(ROL) ? '' : `<a class="btn-icono" href="index.html" aria-label="Ir a la app de Cajas" title="Cajas">${IC.cajas}</a>`}
    </header>
    <main id="vista"></main>
    <nav class="tabs" aria-label="Secciones" style="grid-template-columns:repeat(${VISTAS.filter(vistaVisible).length}, 1fr)">
      ${VISTAS.filter(vistaVisible).map(v => `<button type="button" data-vista="${v.id}">${v.icono}<span>${v.nombre}</span><span class="punto" data-punto="${v.id}" hidden></span></button>`).join('')}
    </nav>`;
  $$('[data-vista]').forEach(b => b.onclick = () => irA(b.dataset.vista));
}
function irA(v) {
  // Cada nivel solo entra a sus pestañas (la pantalla host no es para la presentadora)
  const permitidas = VISTAS.filter(vistaVisible).map(x => x.id).concat(SOLO[ROL] ? [] : OCULTAS.filter(o => o !== 'resurtir' || puede.verResurtido()));
  if (!permitidas.includes(v)) v = permitidas[0];
  vista = v;
  history.replaceState(null, '', '#' + v);
  window.scrollTo(0, 0);
  pintar(true);
}
function marcarTabs() {
  $$('[data-vista]').forEach(b => b.setAttribute('aria-current', b.dataset.vista === vista ? 'page' : 'false'));
  const pendientes = D.tablero.filter(c => siguientePaso(c).accion).length;
  const p = $('[data-punto="casilleros"]');
  if (p) { p.hidden = !pendientes; p.textContent = pendientes; }
  const pa = $('[data-punto="acomodo"]');
  if (pa) { pa.hidden = !D.porAcomodar; pa.textContent = D.porAcomodar; }
  $('#titulo').textContent = (VISTAS.find(x => x.id === vista) || { nombre: 'Live' }).nombre;
  document.body.classList.toggle('host', vista === 'host');
}
async function pintar(cambioDeVista = false) {
  marcarTabs();
  const v = $('#vista');
  if (cambioDeVista) v.innerHTML = '<div class="cargando"><div class="spinner"></div></div>';
  try {
    const html = await ({ dm: vistaPresentadora, vivo: vistaVivo, casilleros: vistaCasilleros, acomodo: vistaAcomodo, prendas: vistaPrendas, whatsapp: vistaWhatsApp, ajustes: vistaAjustes, host: vistaHost, resurtir: vistaResurtir })[vista]();
    if (html !== null) v.innerHTML = html;
    conectar[vista] && conectar[vista](v);
  } catch (e) {
    console.error(e);
    v.innerHTML = `<div class="vacio">${IC.alerta}<h2>No se pudo cargar</h2><p>${esc(traducirError(e))}</p><button class="btn btn-primario" onclick="pintar(true)">Reintentar</button></div>`;
  }
}
const conectar = { host: conectarHost, acomodo: conectarAcomodo, dm: conectarPresentadora, resurtir: conectarResurtir };

/* ---------- En vivo ---------- */
function posicionesEspera(feed) {
  const pos = {};
  const porPrenda = {};
  feed.filter(a => a.estado === 'espera').forEach(a => (porPrenda[a.prenda] = porPrenda[a.prenda] || []).push(a));
  Object.values(porPrenda).forEach(l => l.sort((a, b) => new Date(a.mensaje_en) - new Date(b.mensaje_en) || new Date(a.creado_en) - new Date(b.creado_en)).forEach((a, i) => pos[a.id] = i + 1));
  return pos;
}
let modoVivo = null;
async function vistaVivo() {
  await cargar();
  if (!modoVivo) modoVivo = (D.prime && !D.live) ? 'prime' : 'redes';
  const seg = `<div class="segmentos" role="group" aria-label="Tipo de live">
      <button type="button" data-modo="redes" aria-pressed="${modoVivo === 'redes'}">${D.live ? '<span class="punto-rojo"></span>' : ''}Redes · bot</button>
      <button type="button" data-modo="prime" aria-pressed="${modoVivo === 'prime'}">${D.prime ? '<span class="punto-rojo"></span>' : ''}Prime Live · mayoristas</button>
    </div>`;
  return seg + (modoVivo === 'prime' ? await vistaPrime() : vistaRedes());
}
function vistaRedes() {
  const sinClabe = !(D.cfg.clabe || '').trim();
  if (!D.live) {
    const porCobrar = D.tablero.filter(c => ['por_pagar', 'pago_incompleto'].includes(c.estado));
    const enRevision = D.tablero.filter(esRevision).length;
    return `
      ${enRevision ? `<div class="banner banner-aviso">${IC.alerta}<span>${enRevision} ${enRevision === 1 ? 'pedido' : 'pedidos'} del último live por revisar antes de cobrar. <a href="#acomodo" data-ir="acomodo">Revisar en Acomodo</a></span></div>` : ''}
      <div class="vacio">${IC.vivo}<h2>No hay live en curso</h2><p>${TIENE_COMENTARIOS ? 'Al iniciar, el agente aparta lo que comenten en el live y el bot lo que manden por WhatsApp. Si el agente está encendido, el live se inicia solo al empezar a transmitir.' : 'Al iniciar, el bot de WhatsApp empieza a apartar por clave de prenda.'}</p></div>
      ${htmlAgente()}
      ${sinClabe ? `<div class="banner banner-aviso">${IC.alerta}<span>Falta la CLABE para cobrar. <a href="#ajustes" data-ir="ajustes">Ponla en Ajustes</a> antes de cerrar el live.</span></div>` : ''}
      ${puede.operar() ? `<form class="tarjeta" id="f-iniciar">
        <label>Nombre del live (opcional)<input name="titulo" placeholder="Ej. Live mañana" maxlength="60" autocomplete="off"></label>
        <button class="btn btn-marca btn-grande">${IC.vivo} Iniciar live</button>
      </form>` : ''}
      ${porCobrar.length ? `<div class="banner banner-info">${IC.info}<span>${porCobrar.length} ${porCobrar.length === 1 ? 'clienta tiene' : 'clientas tienen'} pago pendiente del último live. <a href="#casilleros" data-ir="casilleros">Ver casilleros</a></span></div>` : ''}`;
  }
  const apartadas = D.feed.filter(a => a.estado !== 'espera');
  const espera = D.feed.filter(a => a.estado === 'espera');
  const clientas = new Set(apartadas.map(a => a.clienta_id)).size;
  const total = apartadas.reduce((s, a) => s + Number(a.precio || 0), 0);
  const pos = posicionesEspera(D.feed);
  const sinCasillero = D.tablero.filter(c => c.live_id === D.live.id && !c.casillero && c.estado === 'abierta').length;
  const nuevos = D.primeraCarga ? new Set() : new Set(D.feed.filter(a => !D.vistos.has(a.id)).map(a => a.id));
  D.feed.forEach(a => D.vistos.add(a.id));
  D.primeraCarga = false;
  return `
    <div class="fila-botones" style="justify-content:space-between;align-items:center">
      <span class="chip chip-vivo"><span class="punto-vivo"></span>EN VIVO desde ${hora(D.live.iniciado_en)}</span>
      <small>${esc(D.live.titulo || '')}</small>
      ${TIENE_COMENTARIOS ? '<button type="button" class="btn btn-mini btn-secundario" data-ir="host">Pantalla host</button>' : ''}
    </div>
    ${htmlAgente()}
    ${htmlDMs()}
    ${puede.operar() ? `<button class="btn btn-peligro btn-grande" id="cerrar-live">Cerrar live</button>
    <p class="nota">Al cerrar ya no se puede apartar. Todavía no se cobra: primero se revisa cada pedido en Acomodo y, cuando esté completo, se manda su nota desde Casilleros.</p>` : ''}
    <div class="kpis">
      <div class="kpi"><small>Apartadas</small><b>${apartadas.length}</b></div>
      <div class="kpi"><small>Clientas</small><b>${clientas}</b></div>
      <div class="kpi"><small>Total</small><b>${dinero(total)}</b></div>
      <div class="kpi"><small>En espera</small><b>${espera.length}</b></div>
    </div>
    ${sinCasillero ? `<div class="banner banner-aviso">${IC.alerta}<span>${sinCasillero} ${sinCasillero === 1 ? 'clienta no tiene' : 'clientas no tienen'} casillero: ya no hay casilleros libres.</span></div>` : ''}
    ${sinClabe ? `<div class="banner banner-aviso">${IC.alerta}<span>Falta la CLABE: los cobros saldrían sin datos de pago. <a href="#ajustes" data-ir="ajustes">Ponla en Ajustes</a>.</span></div>` : ''}
    <h3 class="seccion">Apartados al momento</h3>
    ${D.feed.length ? `<div class="feed">${D.feed.map(a => filaFeed(a, pos, nuevos.has(a.id))).join('')}</div>`
      : `<div class="vacio"><p>Aún no hay apartados. Cuando una clienta ${TIENE_COMENTARIOS ? 'comente una clave en el live o la mande' : 'mande una clave'} por WhatsApp aparece aquí con su casillero.</p></div>`}
    ${htmlCaptura()}`;
}
const origenTxt = a => !a.origen ? '' : ` · <span class="origen">${esc(RED[a.origen] || a.origen)}${a.origen_usuario ? ' @' + esc(a.origen_usuario) : ''}</span>`;
function horas(h) { const n = Number(h); return n === 1 ? '1 hora' : `${n} horas`; }
function filaFeed(a, pos, nuevo) {
  if (a.estado === 'espera') {
    return `<div class="feed-fila espera"><div class="feed-num"><span>${num4(a.prenda)}</span> <span class="chip">Espera #${pos[a.id] || '?'}</span></div>
      <div class="feed-quien"><b>${esc(a.clienta)}</b> · ${horaSeg(a.mensaje_en)}${origenTxt(a)}</div>
      ${puede.operar() ? `<button class="btn btn-mini btn-secundario" data-quitar="${a.id}" aria-label="Quitar de la lista de espera">Quitar</button>` : '<span></span>'}</div>`;
  }
  return `<div class="feed-fila${nuevo ? ' nuevo' : ''}"><div class="feed-num"><span>${num4(a.prenda)}</span><span class="flecha">→</span><span class="cas">${esc(a.casillero || 'SIN CASILLERO')}</span></div>
    <div class="feed-quien"><b>${esc(a.clienta)}</b> · ${horaSeg(a.mensaje_en)}${origenTxt(a)}${a.acomodada_en ? ' · <span class="origen">✓ en casillero</span>' : ''}</div>
    ${a.estado !== 'apartada' ? '<span class="chip chip-ok">Pagada</span>' : puede.operar() ? `<button class="btn btn-mini btn-secundario" data-liberar="${a.id}" data-num="${a.prenda}">Liberar</button>` : '<span class="chip chip-aviso">Apartada</span>'}</div>`;
}
conectar.vivo = raiz => {
  $$('[data-ir]', raiz).forEach(a => a.onclick = e => { e.preventDefault(); irA(a.dataset.ir); });
  const f = $('#f-iniciar', raiz);
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const ok = await accion(() => rpc('live_iniciar', { p_titulo: f.titulo.value, p_usuario: usuario.nombre }), 'Live iniciado. El bot ya está apartando.');
    if (ok) { D.vistos.clear(); D.primeraCarga = true; pintar(); }
  };
  const c = $('#cerrar-live', raiz);
  if (c) c.onclick = async () => {
    const n = new Set(D.feed.filter(a => a.estado === 'apartada').map(a => a.clienta_id)).size;
    if (!(await confirmar('¿Cerrar el live?', `<p>Después de cerrar ya no se puede apartar. Hay <b>${n} ${n === 1 ? 'clienta' : 'clientas'}</b> con prendas.</p><p>Todavía no se les cobra: primero se revisa cada pedido en Acomodo y, cuando esté completo, se manda su nota desde Casilleros.</p>`, 'Cerrar live', true))) return;
    const r = await accion(() => rpc('live_cerrar', { p_live: D.live.id, p_usuario: usuario.nombre }), r => `Live cerrado. ${r} ${r === 1 ? 'pedido' : 'pedidos'} por revisar en Acomodo.`);
    if (r !== null) irA(puede.acomodar() ? 'acomodo' : 'casilleros');
  };
  $$('[data-liberar]', raiz).forEach(b => b.onclick = async () => {
    const prime = /^#/.test(b.dataset.num);
    if (!(await confirmar(`¿Liberar la ${prime ? b.dataset.num : num4(b.dataset.num)}?`, prime
      ? '<p>Se le quita a esta mayorista y la prenda vuelve a estar disponible para las demás.</p>'
      : '<p>Se quita a esta clienta. Si alguien está en espera, pasa automáticamente a la primera y le avisa el bot.</p>', 'Liberar'))) return;
    if (await accion(() => rpc('live_liberar_apartado', { p_apartado: b.dataset.liberar }), 'Prenda liberada')) pintar();
  });
  $$('[data-quitar]', raiz).forEach(b => b.onclick = async () => {
    if (await accion(() => rpc('live_liberar_apartado', { p_apartado: b.dataset.quitar }), 'Quitada de la lista de espera')) pintar();
  });
  $$('[data-modo]', raiz).forEach(b => b.onclick = () => { modoVivo = b.dataset.modo; pintar(); });
  conectarDMs(raiz);
  conectarPrime(raiz);
};

/* ---------- Prime Live (mayoristas) ---------- */
const fotoUrl = ruta => ruta ? `${CFG.supabaseUrl}/storage/v1/object/public/prime/${String(ruta).split('/').map(encodeURIComponent).join('/')}` : '';
const codigoBonito = c => c ? `${c.slice(0, 4)}-${c.slice(4)}` : '';
const fechaLarga = v => v ? new Date(v).toLocaleString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }) : '';
const TALLAS = ['CH', 'M', 'G', 'XG', '2', '4', '6', '8', '10', '12', '14', 'Única'];
let primeSel = null;          // live programado que se está preparando
let verInvitadas = false;     // sección de invitadas abierta durante el live
let capturandoDesde = 0;      // la cámara está abierta: no refrescar la pantalla

async function datosInvitaciones(liveId) {
  const [mayoristas, invs] = await Promise.all([
    q(sb.from('clientas').select('id,nombre,apellidos,telefono,correo,mayorista').eq('mayorista', true).order('nombre', { ascending: true }).limit(1000)),
    q(sb.from('prime_invitaciones').select('*').eq('live_id', liveId).limit(1000)),
  ]);
  return { mayoristas, invs };
}
function mensajeInvitacion(l, cl, inv) {
  const url = new URL('prime.html', location.href);
  url.search = ''; url.hash = '';
  url.searchParams.set('c', inv.codigo);
  const cuando = l.programado_para ? `\n📅 ${fechaLarga(l.programado_para)}` : '';
  return `Hola ${(cl.nombre || '').split(' ')[0]} 👋 Estás invitada a *${l.titulo || 'Prime Live'}* de Outlet Prime${cuando}\n\n` +
    `Entra aquí: ${url.href}\nTu contraseña (solo para este live): *${codigoBonito(inv.codigo)}*\n\nEs personal, no la compartas. 💕`;
}
function htmlInvitaciones(l, { mayoristas, invs }) {
  const porClienta = Object.fromEntries(invs.map(i => [i.clienta_id, i]));
  const activas = invs.filter(i => i.activa);
  const entraron = activas.filter(i => i.primer_acceso).length;
  const filas = mayoristas.map(m => {
    const inv = porClienta[m.id];
    const nombre = `${m.nombre || ''} ${m.apellidos || ''}`.trim();
    if (!inv || !inv.activa) {
      return `<div class="invitada"><div><b>${esc(nombre)}</b><small>${telBonito(m.telefono)}${m.correo ? ' · ' + esc(m.correo) : ''}</small></div>
        <button class="btn btn-mini btn-primario" data-invitar="${m.id}">Invitar</button></div>`;
    }
    const msg = mensajeInvitacion(l, m, inv);
    const tel = String(m.telefono || '').replace(/\D/g, '');
    return `<div class="invitada si"><div><b>${esc(nombre)}</b>
        <small>Contraseña <b class="codigo">${codigoBonito(inv.codigo)}</b> · ${inv.primer_acceso ? `<span class="ok">✓ entró ${hora(inv.ultimo_acceso)}</span>` : 'no ha entrado'}</small></div>
      <div class="fila-botones">
        ${tel.length === 10 ? `<a class="btn btn-mini btn-wa" target="_blank" rel="noopener" href="https://wa.me/52${tel}?text=${encodeURIComponent(msg)}">WhatsApp</a>` : ''}
        ${m.correo ? `<a class="btn btn-mini btn-secundario" href="mailto:${encodeURIComponent(m.correo)}?subject=${encodeURIComponent('Tu acceso a Prime Live · Outlet Prime')}&body=${encodeURIComponent(msg.replace(/\*/g, ''))}">Correo</a>` : ''}
        <button class="btn btn-mini btn-secundario" data-copiar="${esc(msg)}">Copiar</button>
        <button class="btn btn-mini btn-secundario" data-revocar="${inv.id}" aria-label="Quitar invitación">Quitar</button>
      </div></div>`;
  }).join('');
  const sinInvitar = mayoristas.filter(m => !(porClienta[m.id] && porClienta[m.id].activa)).length;
  return `
    <div class="tarjeta">
      <div class="cas-cab"><h3 style="font-size:17px">Mayoristas invitadas</h3><span class="chip">${activas.length} invitadas · ${entraron} entraron</span></div>
      <p class="nota">Cada una recibe una contraseña que solo sirve para este Prime Live. Mándasela con el botón de WhatsApp o Correo.</p>
      ${mayoristas.length ? `<div class="lista-invitadas">${filas}</div>` : '<p class="nota">Todavía no hay mayoristas. Agrégalas abajo.</p>'}
      ${sinInvitar > 1 ? `<button class="btn btn-secundario" data-invitar-todas="1">Invitar a las ${sinInvitar} que faltan</button>` : ''}
      <details class="plegable"><summary>Agregar mayorista</summary>
        <form class="formulario" id="f-mayorista" style="margin-top:10px">
          <label>Nombre<input name="nombre" required maxlength="60" autocomplete="off"></label>
          <div class="dos">
            <label>WhatsApp<input name="tel" inputmode="tel" required placeholder="10 dígitos" autocomplete="off"></label>
            <label>Correo<input name="correo" type="email" inputmode="email" autocomplete="off" placeholder="opcional"></label>
          </div>
          <button class="btn btn-primario">Agregar e invitar</button>
          <p class="nota">Si ese WhatsApp ya es clienta, se marca como mayorista sin duplicarla.</p>
        </form>
      </details>
    </div>`;
}

async function vistaPrime() {
  if (D.prime) return vistaPrimeActivo(D.prime);
  if (primeSel && !D.primeProg.some(l => l.id === primeSel)) primeSel = null;
  const l = D.primeProg.find(x => x.id === primeSel) || D.primeProg[0];
  const manana = new Date(Date.now() + 864e5); manana.setHours(17, 0, 0, 0);
  const valorFecha = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
  let detalle = '';
  if (l) {
    const datos = await datosInvitaciones(l.id);
    detalle = `
      <div class="tarjeta">
        <div class="cas-cab"><h3 style="font-size:19px">${esc(l.titulo || 'Prime Live')}</h3><span class="chip chip-info">Programado</span></div>
        <p>${l.programado_para ? esc(fechaLarga(l.programado_para)) : 'Sin fecha'} · ${dinero(l.precio)} por prenda · ${l.limite ? `máximo ${l.limite} por mayorista` : 'sin límite'}</p>
        <div class="fila-botones">
          ${puede.operar() ? `<button class="btn btn-marca" data-prime-iniciar="${l.id}">${IC.vivo} Iniciar Prime Live</button>` : ''}
          ${puede.duena() ? `<button class="btn btn-secundario" data-prime-cancelar="${l.id}">Cancelar</button>` : ''}
        </div>
      </div>
      ${puede.duena() ? htmlInvitaciones(l, datos) : ''}`;
  }
  return `
    ${D.primeProg.length > 1 ? `<div class="filtros">${D.primeProg.map(x => `<button type="button" class="filtro" data-prime-sel="${x.id}" aria-pressed="${x.id === (l && l.id)}">${esc(x.titulo || 'Prime Live')} <b>${x.programado_para ? new Date(x.programado_para).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : ''}</b></button>`).join('')}</div>` : ''}
    ${detalle || `<div class="vacio">${IC.vivo}<h2>No hay Prime Live programado</h2><p>${puede.duena() ? 'Prográmalo, invita a tus mayoristas y mándales su contraseña.' : 'Una dueña lo programa e invita a las mayoristas.'}</p></div>`}
    ${puede.duena() ? `<details class="plegable"${l ? '' : ' open'}><summary>Programar un Prime Live</summary>
      <form class="tarjeta formulario" id="f-prime-programar" style="margin-top:10px">
        <label>Nombre<input name="titulo" maxlength="60" placeholder="Ej. Prime Live jueves" autocomplete="off"></label>
        <label>Fecha y hora<input name="cuando" type="datetime-local" value="${valorFecha(manana)}" required></label>
        <div class="dos">
          <label>Precio por prenda<input name="precio" type="number" min="1" step="1" value="${Number(D.cfg.prime_precio || 89)}"></label>
          <label>Máximo por mayorista<input name="limite" type="number" min="1" step="1" value="${D.cfg.prime_limite ?? ''}" placeholder="Sin límite"></label>
        </div>
        <button class="btn btn-primario">Programar</button>
      </form>
    </details>` : ''}`;
}

async function vistaPrimeActivo(l) {
  const [prendas, datos] = await Promise.all([
    q(sb.from('prime_tablero').select('*').eq('live_id', l.id).neq('estado', 'quitada').order('num', { ascending: false }).limit(500)),
    datosInvitaciones(l.id),
  ]);
  const apartadas = prendas.filter(p => p.apartado_id);
  const total = apartadas.reduce((s, p) => s + Number(p.precio || 0), 0);
  const activas = datos.invs.filter(i => i.activa);
  const siguiente = (prendas[0] ? prendas[0].num : 0) + 1;
  const ahora = Date.now();
  const tile = p => {
    const falta = Math.ceil((new Date(p.disponible_en) - ahora) / 1000);
    const estado = p.apartado_id
      ? `<span class="chip ${p.apartado_estado === 'pagada' ? 'chip-ok' : 'chip-aviso'}">${p.apartado_estado === 'pagada' ? 'Pagada' : 'Apartada'}</span><small><b>${esc(p.clienta)}</b> → <b class="cas-mini">${esc(p.casillero || 'SIN CASILLERO')}</b></small>`
      : `<span class="chip chip-ok">${falta > 0 ? `Sale en ${falta} s` : 'Disponible'}</span>`;
    return `<div class="ptile">
      <img src="${esc(fotoUrl(p.foto))}" alt="Prenda #${p.num}" loading="lazy">
      <div class="ptile-in">
        <div class="cas-cab"><b>#${p.num}</b><span>${esc(p.talla || '')}</span></div>
        ${estado}
        <div class="fila-botones">
          ${puede.operar() && p.apartado_id && p.apartado_estado === 'apartada' ? `<button class="btn btn-mini btn-secundario" data-liberar="${p.apartado_id}" data-num="#${p.num}">Liberar</button>` : ''}
          ${puede.operar() && !p.apartado_id ? `<button class="btn btn-mini btn-secundario" data-quitar-prenda="${p.id}">Quitar</button>` : ''}
        </div>
      </div></div>`;
  };
  return `
    <div class="fila-botones" style="justify-content:space-between;align-items:center">
      <span class="chip chip-vivo"><span class="punto-vivo"></span>PRIME EN VIVO desde ${hora(l.iniciado_en)}</span>
      <small>${esc(l.titulo || '')}</small>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Mostradas</small><b>${prendas.length}</b></div>
      <div class="kpi"><small>Apartadas</small><b>${apartadas.length}</b></div>
      <div class="kpi"><small>Total</small><b>${dinero(total)}</b></div>
      <div class="kpi"><small>Entraron</small><b>${activas.filter(i => i.primer_acceso).length}/${activas.length}</b></div>
    </div>
    ${l.video_url ? `<div class="video-prime"><iframe src="${esc(l.video_url)}" title="Transmisión" allow="autoplay; fullscreen" allowfullscreen></iframe></div>` : ''}
    ${puede.operar() ? `<label class="btn btn-marca btn-grande capturar" id="capturar">📷 Capturar prenda #${siguiente}
      <input type="file" accept="image/*" capture="environment" hidden id="foto-prime">
    </label>` : ''}
    <p class="nota">Toma la foto cuando la prenda esté bien a cuadro. Al publicarla, a todas las mayoristas les aparece al mismo tiempo con su botón "Apartar" (${dinero(l.precio)}).</p>
    <h3 class="seccion">Prendas mostradas</h3>
    ${prendas.length ? `<div class="pgrid">${prendas.map(tile).join('')}</div>` : '<div class="vacio"><p>Todavía no se ha mostrado ninguna prenda.</p></div>'}
    ${puede.duena() ? `<details class="plegable" id="det-invitadas"${verInvitadas ? ' open' : ''}><summary>Mayoristas invitadas (${activas.length})</summary>${htmlInvitaciones(l, datos)}</details>` : ''}
    ${puede.operar() ? '<button class="btn btn-peligro btn-grande" id="cerrar-prime">Cerrar Prime Live y mandar cobros</button>' : ''}
    <p class="nota">Al cerrar, cada mayorista ve en su página su total, la CLABE y su folio. Tiene ${horas(D.cfg.horas_limite)} para pagar.</p>`;
}

async function reducirFoto(file, maxLado = 1100, calidad = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la foto.')); i.src = url; });
    const k = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', calidad));
  } finally { URL.revokeObjectURL(url); }
}
async function publicarFoto(l, file, num) {
  capturandoDesde = Date.now();
  let blob;
  try { blob = await reducirFoto(file); } catch (e) { toast(traducirError(e), 'error'); capturandoDesde = 0; return; }
  const vista = URL.createObjectURL(blob);
  let talla = null;
  const ok = await modal({
    titulo: `Publicar prenda #${num}`,
    html: `<img src="${vista}" alt="Prenda capturada" class="foto-previa">
      <p class="nota">Talla (opcional):</p>
      <div class="tallas">${TALLAS.map(t => `<button type="button" class="talla" data-talla="${t}" aria-pressed="false">${t}</button>`).join('')}</div>`,
    botones: [{ texto: 'Otra foto', valor: false }, { texto: `Publicar #${num}`, valor: true, clase: 'btn-marca' }],
    alAbrir: el => $$('.talla', el).forEach(b => b.onclick = () => {
      const ya = b.getAttribute('aria-pressed') === 'true';
      $$('.talla', el).forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', String(!ya)); talla = ya ? null : b.dataset.talla;
    }),
  });
  URL.revokeObjectURL(vista);
  if (!ok) { capturandoDesde = 0; return; }
  const r = await accion(async () => {
    const ruta = `${l.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await sb.storage.from('prime').upload(ruta, await blob.arrayBuffer(), { contentType: 'image/jpeg', upsert: false });
    if (error) throw error;
    return rpc('prime_publicar', { p_live: l.id, p_foto: ruta, p_talla: talla, p_usuario: usuario.nombre });
  }, p => `Prenda #${p.num} publicada. Ya la ven todas.`);
  capturandoDesde = 0;
  if (r) pintar();
}

function conectarPrime(raiz) {
  $$('[data-prime-sel]', raiz).forEach(b => b.onclick = () => { primeSel = b.dataset.primeSel; pintar(); });
  const fp = $('#f-prime-programar', raiz);
  if (fp) fp.onsubmit = async e => {
    e.preventDefault();
    const cuando = fp.cuando.value ? new Date(fp.cuando.value) : null;
    const l = await accion(() => rpc('prime_programar', {
      p_titulo: fp.titulo.value, p_programado_para: cuando ? cuando.toISOString() : null,
      p_precio: +fp.precio.value || null, p_limite: fp.limite.value ? +fp.limite.value : null, p_usuario: usuario.nombre,
    }), 'Prime Live programado. Ahora invita a tus mayoristas.');
    if (l) { primeSel = l.id; pintar(); }
  };
  const liveId = (D.prime && D.prime.id) || (D.primeProg.find(x => x.id === primeSel) || D.primeProg[0] || {}).id;
  const invitar = async ids => {
    for (const id of ids) {
      const r = await accion(() => rpc('prime_invitar', { p_live: liveId, p_clienta: id, p_usuario: usuario.nombre }));
      if (!r) break;
    }
    pintar();
  };
  $$('[data-invitar]', raiz).forEach(b => b.onclick = () => invitar([b.dataset.invitar]));
  $$('[data-invitar-todas]', raiz).forEach(b => b.onclick = () => invitar($$('[data-invitar]', raiz).map(x => x.dataset.invitar)));
  $$('[data-revocar]', raiz).forEach(b => b.onclick = async () => {
    if (!(await confirmar('¿Quitar la invitación?', '<p>Su contraseña deja de funcionar. Puedes volver a invitarla y se reactiva la misma.</p>', 'Quitar'))) return;
    if (await accion(() => rpc('prime_revocar', { p_invitacion: b.dataset.revocar }), 'Invitación quitada')) pintar();
  });
  $$('[data-copiar]', raiz).forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copiar); toast('Mensaje copiado'); }
    catch (e) { await modal({ titulo: 'Copia el mensaje', html: `<textarea readonly style="min-height:160px">${esc(b.dataset.copiar)}</textarea>`, botones: [{ texto: 'Listo', valor: true }] }); }
  });
  const fm = $('#f-mayorista', raiz);
  if (fm) fm.onsubmit = async e => {
    e.preventDefault();
    const tel = fm.tel.value.replace(/\D/g, '').slice(-10);
    if (tel.length !== 10) { toast('El WhatsApp debe tener 10 dígitos.', 'error'); return; }
    const correo = fm.correo.value.trim().toLowerCase();
    const r = await accion(async () => {
      const [ya] = await q(sb.from('clientas').select('id,correo').eq('telefono', tel).limit(1));
      let id;
      if (ya) {
        await q(sb.from('clientas').update({ mayorista: true, ...(correo && !ya.correo ? { correo } : {}) }).eq('id', ya.id).select('id'));
        id = ya.id;
      } else {
        const [n] = await q(sb.from('clientas').insert({
          id: crypto.randomUUID ? crypto.randomUUID() : undefined, nombre: fm.nombre.value.trim(), telefono: tel, correo: correo || null,
          mayorista: true, creado_por: usuario.nombre, fecha_registro: new Date().toISOString().slice(0, 10),
        }).select('id'));
        id = n.id;
      }
      if (liveId) await rpc('prime_invitar', { p_live: liveId, p_clienta: id, p_usuario: usuario.nombre });
      return id;
    }, liveId ? 'Mayorista agregada e invitada' : 'Mayorista agregada');
    if (r) pintar();
  };
  $$('[data-prime-iniciar]', raiz).forEach(b => b.onclick = async () => {
    if (!(await confirmar('¿Iniciar el Prime Live?', '<p>Las mayoristas invitadas verán la transmisión y podrán apartar en cuanto publiques la primera prenda.</p>', 'Iniciar'))) return;
    if (await accion(() => rpc('prime_iniciar', { p_live: b.dataset.primeIniciar, p_usuario: usuario.nombre }), 'Prime Live en curso')) pintar();
  });
  $$('[data-prime-cancelar]', raiz).forEach(b => b.onclick = async () => {
    if (!(await confirmar('¿Cancelar este Prime Live?', '<p>Se borra la programación y las contraseñas dejan de funcionar.</p>', 'Cancelar live', true))) return;
    if (await accion(() => rpc('prime_cancelar', { p_live: b.dataset.primeCancelar }), 'Prime Live cancelado')) { primeSel = null; pintar(); }
  });
  const det = $('#det-invitadas', raiz);
  if (det) det.ontoggle = () => { verInvitadas = det.open; };
  const cap = $('#capturar', raiz), inp = $('#foto-prime', raiz);
  if (cap && inp && D.prime) {
    const l = D.prime, num = parseInt(cap.textContent.replace(/\D/g, ''), 10) || 1;
    cap.addEventListener('click', () => { capturandoDesde = Date.now(); });
    inp.onchange = () => { const f = inp.files[0]; inp.value = ''; if (f) publicarFoto(l, f, num); else capturandoDesde = 0; };
  }
  $$('[data-quitar-prenda]', raiz).forEach(b => b.onclick = async () => {
    if (!(await confirmar('¿Quitar esta prenda?', '<p>Deja de verse para las mayoristas. Úsalo si la foto salió mal.</p>', 'Quitar'))) return;
    if (await accion(() => rpc('prime_editar_prenda', { p_prenda: b.dataset.quitarPrenda, p_quitar: true }), 'Prenda quitada')) pintar();
  });
  const cp = $('#cerrar-prime', raiz);
  if (cp && D.prime) cp.onclick = async () => {
    if (!(await confirmar('¿Cerrar el Prime Live?', '<p>Ya no se podrá apartar. Cada mayorista verá su total y cómo pagar.</p>', 'Cerrar y cobrar', true))) return;
    const r = await accion(() => rpc('live_cerrar', { p_live: D.prime.id, p_usuario: usuario.nombre }), r => `Prime Live cerrado. ${r} ${r === 1 ? 'mayorista tiene' : 'mayoristas tienen'} cobro.`);
    if (r !== null) irA('casilleros');
  };
}

/* ---------- Casilleros ---------- */
let filtroCas = 'todos';
// Pedido en revisión: el live ya cerró y falta confirmar que todas sus prendas están en el casillero
const esRevision = c => c.estado === 'abierta' && c.live_estado === 'cerrado';
// Prendas que no se van a cobrar: no se encontraron o no se pueden vender
const faltanRev = c => (+c.rev_no_encontradas || 0) + (+c.rev_no_vendibles || 0);
const textoFaltan = c => [c.rev_faltantes ? 'No se encontraron: <b>' + esc(c.rev_faltantes) + '</b>' : '',
  c.rev_no_vendibles_txt ? 'No vendibles: <b>' + esc(c.rev_no_vendibles_txt) + '</b>' : ''].filter(Boolean).join(' · ');
// Color de la revisión: amarillo si se marcaron prendas como no encontradas, verde si el pedido está completo
const colorRevision = c => {
  if (esRevision(c)) {
    if (faltanRev(c) > 0) return 'rev-incompleto';
    if (+c.rev_pendientes === 0 && +c.rev_encontradas > 0) return 'rev-completo';
    return '';
  }
  return c.estado === 'por_pagar' && !c.cobro_enviado_en && c.live_estado === 'cerrado' ? 'rev-completo' : '';
};
function siguientePaso(c) {
  const falta = Number(c.total) - Number(c.monto_pagado);
  switch (c.estado) {
    case 'abierta': {
      if (!esRevision(c)) return { chip: ['chip-info', 'Live en curso'], paso: 'Guardar aquí lo que aparte' };
      const enc = +c.rev_encontradas || 0, no = faltanRev(c), pend = +c.rev_pendientes || 0;
      if (no && pend) return { chip: ['chip-aviso', `Incompleto · faltan ${no}`], paso: `${textoFaltan(c)}. Faltan ${pend} por revisar.`, revisar: true };
      if (no) return { chip: ['chip-aviso', `Incompleto · faltan ${no}`], paso: `${textoFaltan(c)}. Si de verdad no están, ciérralo sin ellas dentro de la lista: el total se ajusta solo.`, revisar: true };
      if (pend) return { chip: ['chip-aviso', 'En revisión'], paso: `${enc} de ${enc + pend} prendas encontradas. Revísalas una por una. Aún no se cobra.`, revisar: true };
      return { chip: ['chip-ok', 'Completo ✓'], paso: 'Todas las prendas están en el casillero. Toca <b>Confirmar pedido completo</b> dentro de la lista.', revisar: true };
    }
    case 'por_pagar':
      if (!c.cobro_enviado_en) return { chip: ['chip-ok', 'Listo para cobrar'], paso: 'Pedido completo. Falta mandar su nota de cobro; el plazo empieza al mandarla.', pago: true, cobro: 'mandar' };

/* ---------- Avisos en el teléfono (notificaciones) ---------- */
const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const soportaPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64aBytes(s) {
  const t = s.replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(t + '='.repeat((4 - (t.length % 4)) % 4)), c => c.charCodeAt(0));
}
function nombreDispositivo() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/Android/.test(ua)) return 'Android';
  if (/Mac/.test(ua)) return 'Mac';
  if (/Windows/.test(ua)) return 'Windows';
  return 'Navegador';
}
async function estadoAvisos() {
  if (!soportaPush()) return { modo: esIOS && !instalada() ? 'instalar' : 'nosoporta' };
  if (Notification.permission === 'denied') return { modo: 'bloqueado' };
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    return { modo: sub ? 'activo' : 'inactivo', sub };
  } catch (e) { return { modo: 'inactivo' }; }
}
async function activarAvisos() {
  // El permiso se pide primero, directo del toque, como exige el iPhone
  const permiso = await Notification.requestPermission();
  if (permiso !== 'granted') throw new Error('No se dio permiso de notificaciones. Actívalo en Ajustes del teléfono → Notificaciones.');
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const { data, error } = await sb.functions.invoke('avisos', { body: { accion: 'llave' } });
  if (error || !data || !data.llave) throw new Error('Falta publicar la función de avisos en Supabase.');
  const llave = b64aBytes(data.llave);
  let sub = await reg.pushManager.getSubscription();
  if (sub) {
    const actual = sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
    if (actual && (actual.length !== llave.length || actual.some((b, i) => b !== llave[i]))) { await sub.unsubscribe(); sub = null; }
  }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: llave });
  const j = sub.toJSON();
  await q(sb.from('avisos_dispositivos').upsert({
    endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth,
    nombre: `${usuario.nombre} · ${nombreDispositivo()}`, activo: true, ultimo_error: null,
  }, { onConflict: 'endpoint' }).select('id'));
  return true;
}
async function desactivarAvisos() {
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  if (sub) {
    await q(sb.from('avisos_dispositivos').delete().eq('endpoint', sub.endpoint).select('id'));
    await sub.unsubscribe();
  }
  return true;
}

conectar.ajustes = raiz => {
  conectarAvisos(raiz);
  conectarEquipo(raiz);
  if (!$('#f-ajustes', raiz)) {   // presentadora: solo avisos y sesión
    $('#salir', raiz).onclick = async () => { await sb.auth.signOut(); location.reload(); };
    return;
  }
  $('#f-ajustes', raiz).onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const clabe = f.clabe.value.replace(/\D/g, '');
    if (clabe && clabe.length !== 18) { toast('La CLABE debe tener 18 dígitos.', 'error'); return; }
    const datos = {
      clabe: clabe || null, banco: f.banco.value.trim() || null, titular: f.titular.value.trim() || null,
      horas_recordatorio: +f.horas_recordatorio.value, horas_limite: +f.horas_limite.value, horas_liberar: +f.horas_liberar.value,
      precio: +f.precio.value, limite_por_clienta: f.limite_por_clienta.value ? +f.limite_por_clienta.value : null,
      mensaje_sin_live: f.mensaje_sin_live.value.trim() || 'Ahorita no hay live en curso.', actualizado_en: new Date().toISOString(),
      prime_precio: +f.prime_precio.value || 89, prime_limite: f.prime_limite.value ? +f.prime_limite.value : null,
      prime_retraso: Math.max(0, Math.min(30, +f.prime_retraso.value || 0)), prime_video_url: f.prime_video_url.value.trim() || null,
      dias_caja: Math.max(1, +f.dias_caja.value || 20), caja_llena_prendas: f.caja_llena_prendas.value ? +f.caja_llena_prendas.value : null,
    };
    if (f.mensaje_dm) Object.assign(datos, {
      whatsapp_numero: f.whatsapp_numero.value.trim() || null,
      minutos_registro: Math.max(1, Math.min(120, +f.minutos_registro.value || 10)),
      red_principal: f.red_principal.value,
      mensaje_dm: f.mensaje_dm.value.trim() || MENSAJE_DM,
    });
    if (datos.prime_video_url && !/^https:\/\//i.test(datos.prime_video_url)) { toast('El enlace del video debe empezar con https://', 'error'); return; }
    if (!(datos.horas_recordatorio < datos.horas_limite && datos.horas_limite <= datos.horas_liberar)) {
      toast('Las horas deben ir en orden: recordatorio, luego límite de pago, luego liberar.', 'error'); return;
    }
    await accion(async () => {
      const filas = await q(sb.from('live_config').update(datos).eq('id', true).select('id'));
      if (!filas.length) throw new Error('Tu nivel de acceso no permite cambiar los ajustes.');
      return true;
    }, 'Ajustes guardados');
  };
  $('#salir', raiz).onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const fa = $('#f-agregar', raiz);
  if (fa) fa.onsubmit = async e => {
    e.preventDefault();
    const usuarioRed = fa.usuario.value.trim().replace(/^@/, ''), nombre = fa.nombre.value.trim(), apellidos = fa.apellidos.value.trim();
    const tel = fa.tel.value.replace(/\D/g, '').slice(-10);
    if (!usuarioRed) return toast('Escribe su usuario.', 'error');
    if (nombre.length < 2 || apellidos.length < 2) return toast('Escribe su nombre y por lo menos un apellido.', 'error');
    if (fa.tel.value.trim() && tel.length !== 10) return toast('El WhatsApp debe tener 10 dígitos (o déjalo vacío).', 'error');
    const r = await accion(() => rpc('live_clienta_agregar', { p_red: fa.red.value, p_usuario: usuarioRed, p_nombre: nombre, p_apellidos: apellidos, p_telefono: tel || null, p_por: usuario.email }));
    if (!r || r === true) return;
    const extra = [r.tuyas_txt ? `${r.tuyas_txt} a su casillero` : '', r.espera_txt ? `en espera de ${r.espera_txt}` : ''].filter(Boolean).join(' · ');
    toast(`${r.existente ? 'Ligada a' : 'Agregada:'} ${r.clienta} · @${r.usuario}${extra ? ' · ' + extra : ''}`);
    fa.reset();
    fa.usuario.focus();
  };
  const fr = $('#f-redes', raiz);
  if (fr) {
    const buscar = async () => {
      const t = fr.buscar.value.trim().replace(/^@/, '').replace(/[%,()*]/g, '');
      let consulta = sb.from('clientas_redes_tablero').select('*').order('ligada_en', { ascending: false }).limit(30);
      if (t) consulta = consulta.or(`usuario.ilike.*${t}*,clienta.ilike.*${t}*`);
      const filas = await q(consulta);
      $('#redes-res', raiz).innerHTML = filas.length ? `<div class="lista-simple">${filas.map(r => `<div class="miembro"><div><b>@${esc(r.usuario)} · ${esc(RED[r.red] || r.red)}</b><small>${esc(r.clienta)} · ${telBonito(r.telefono)} · ${fechaHora(r.ligada_en)}${r.ligada_por ? ' · ' + esc(r.ligada_por) : ''}</small></div>
        ${puede.operar() ? `<button type="button" class="btn btn-mini btn-secundario" data-desligar="${esc(r.red)}|${esc(r.usuario)}">Quitar</button>` : ''}</div>`).join('')}</div>` : '<p class="nota">Sin resultados.</p>';
      $$('[data-desligar]', raiz).forEach(b => b.onclick = async () => {
        const [red, u] = b.dataset.desligar.split('|');
        if (!(await confirmar(`¿Quitar @${u}?`, '<p>Ya no se le apartará sola al comentar; se le pedirá DM otra vez.</p>', 'Quitar', true))) return;
        if (await accion(() => rpc('live_desligar_red', { p_red: red, p_usuario: u }), 'Usuario quitado')) buscar();
      });
    };
    fr.onsubmit = e => { e.preventDefault(); accion(buscar); };
    accion(buscar);
  }
};

/* ---------- Ayuda: burbuja movible y diálogo de dudas ----------
 * Un asistente que explica cómo usar el panel según el nivel de quien pregunta (función `ayuda`).
 * Solo responde con la guía del equipo: no lee ni cambia nada del live. */
const AYUDA = { mensajes: [], esperando: false };
const AYUDA_SUGERENCIAS = {
  duena: ['¿Cómo ligo a una clienta nueva con su WhatsApp?', '¿Cómo registro un pago?', '¿Qué hago si no se apartan los comentarios?'],
  operacion: ['¿Cómo ligo a una clienta nueva con su WhatsApp?', '¿Cómo capturo un comentario a mano?', 'Se apartó una prenda a la clienta equivocada'],
  supervisor: ['¿Cómo ligo a una clienta nueva con su WhatsApp?', '¿Qué significa "Pide DM"?', '¿Cómo veo quién tiene una prenda?'],
  live: ['¿Qué hago con cada aviso que me llega?', '¿Qué es la charola de pendientes?', 'Palomeé una prenda por error'],
  presentadora: ['¿Qué hago cuando me llega "Pide DM"?', 'No me llegan los avisos al celular', '¿Cómo instalo el panel en mi iPhone?'],
  resurtido: ['¿Cuándo cuenta una prenda para resurtir?', 'Repuse solo una parte, ¿cómo lo anoto?', 'No me llegan los avisos al celular'],
};
const AYUDA_FALLAS = {
  sin_llave: 'La ayuda todavía no está activada. Avísale a una dueña.',
  llave: 'La ayuda no está bien configurada. Avísale a una dueña.',
  limite: 'Hay muchas preguntas al mismo tiempo. Intenta de nuevo en un momento.',
  tardo: 'La respuesta tardó demasiado. Intenta de nuevo.',
  sin_acceso: 'Tu sesión expiró. Cierra la ayuda y vuelve a entrar al panel.',
  rechazo: 'Eso no te lo puedo responder. Pregúntame cómo hacer algo en el panel.',
};
const ayudaTexto = t => esc(t).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');

function montarAyuda() {
  if ($('#ayuda-burbuja')) return;
  const b = document.createElement('button');
  b.type = 'button';
  b.id = 'ayuda-burbuja';
  b.className = 'ayuda-burbuja';
  b.title = 'Ayuda';
  b.setAttribute('aria-label', 'Ayuda: pregunta cómo usar el panel');
  b.innerHTML = IC.ayuda;
  document.body.appendChild(b);

  const LADO = 54, MARGEN = 10, LLAVE = 'op-ayuda-burbuja';
  // No tapa la barra de arriba ni las pestañas de abajo
  const limites = () => {
    const barra = $('.barra-sup'), tabs = $('.tabs');
    const arriba = (barra ? barra.getBoundingClientRect().bottom : 0) + MARGEN;
    const abajo = (tabs ? tabs.getBoundingClientRect().top : innerHeight) - LADO - MARGEN;
    return { x0: MARGEN, x1: Math.max(MARGEN, innerWidth - LADO - MARGEN), y0: Math.max(MARGEN, arriba), y1: Math.max(arriba, abajo) };
  };
  const colocar = (x, y) => {
    const l = limites();
    x = Math.min(l.x1, Math.max(l.x0, x));
    y = Math.min(l.y1, Math.max(l.y0, y));
    Object.assign(b.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' });
    return { x, y };
  };
  // Se guarda de qué lado quedó y a qué altura (en proporción), para que sirva si se gira el teléfono
  const guardar = (x, y) => {
    const l = limites();
    try { localStorage.setItem(LLAVE, JSON.stringify({ derecha: x > (l.x0 + l.x1) / 2, alto: (y - l.y0) / Math.max(1, l.y1 - l.y0) })); } catch (e) { /* sin almacenamiento: no pasa nada */ }
  };
  const restaurar = () => {
    let p = null;
    try { p = JSON.parse(localStorage.getItem(LLAVE) || 'null'); } catch (e) { /* se queda en su lugar de siempre */ }
    const l = limites();
    // Sin lugar guardado empieza abajo a la izquierda: a la derecha van los botones (Liberar, Quitar, ✓)
    if (!p || typeof p.alto !== 'number') p = { derecha: false, alto: 1 };
    colocar(p.derecha ? l.x1 : l.x0, l.y0 + Math.min(1, Math.max(0, p.alto)) * (l.y1 - l.y0));
  };
  restaurar();
  addEventListener('resize', restaurar);

  let toque = null;
  b.addEventListener('pointerdown', e => {
    if (e.button) return;
    const r = b.getBoundingClientRect();
    toque = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, movio: false };
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* navegadores viejos */ }
  });
  b.addEventListener('pointermove', e => {
    if (!toque || e.pointerId !== toque.id) return;
    if (!toque.movio && Math.hypot(e.clientX - toque.x, e.clientY - toque.y) < 8) return;
    toque.movio = true;
    b.classList.add('arrastrando');
    colocar(e.clientX - toque.dx, e.clientY - toque.dy);
  });
  const soltar = e => {
    if (!toque || e.pointerId !== toque.id) return;
    const t = toque;
    toque = null;
    b.classList.remove('arrastrando');
    if (!t.movio) { if (e.type === 'pointerup') abrirAyuda(); return; }
    // Al soltarla se pega a la orilla más cercana para no estorbar lo que se está leyendo
    const r = b.getBoundingClientRect(), l = limites();
    const p = colocar(r.left + LADO / 2 > innerWidth / 2 ? l.x1 : l.x0, r.top);
    guardar(p.x, p.y);
  };
  b.addEventListener('pointerup', soltar);
  b.addEventListener('pointercancel', soltar);
  b.addEventListener('click', e => { if (e.detail === 0) abrirAyuda(); }); // con teclado (Enter o espacio)
}

function abrirAyuda() {
  if ($('.ayuda-fondo')) return;
  const fondo = document.createElement('div');
  fondo.className = 'ayuda-fondo';
  fondo.innerHTML = `<section class="ayuda-panel" role="dialog" aria-modal="true" aria-label="Ayuda">
    <header class="ayuda-cab">
      <div><h2>Ayuda</h2><small>Dudas sobre cómo usar el panel</small></div>
      <button type="button" class="ayuda-limpiar" hidden>Borrar</button>
      <button type="button" class="ayuda-cerrar" aria-label="Cerrar ayuda">×</button>
    </header>
    <div class="ayuda-msjs" aria-live="polite"></div>
    <form class="ayuda-form">
      <textarea name="duda" rows="1" maxlength="1000" placeholder="Escribe tu duda…" aria-label="Tu duda" enterkeyhint="send"></textarea>
      <button class="btn btn-marca" aria-label="Enviar">${IC.enviar}</button>
    </form></section>`;
  document.body.appendChild(fondo);
  const lista = $('.ayuda-msjs', fondo), form = $('.ayuda-form', fondo), campo = form.duda;

  const pintarMsjs = () => {
    const sugerencias = AYUDA.mensajes.length ? '' : `<div class="ayuda-sugerencias">${(AYUDA_SUGERENCIAS[ROL] || AYUDA_SUGERENCIAS.operacion).map(t => `<button type="button" data-sugerencia="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
    lista.innerHTML = `<div class="ayuda-msj bot">Hola. Pregúntame cómo hacer algo en el panel y te digo los pasos.

Solo explico cómo se usa: no veo lo que está pasando en el live.</div>${sugerencias}`
      + AYUDA.mensajes.map(m => `<div class="ayuda-msj ${m.rol === 'user' ? 'yo' : 'bot'}${m.falla ? ' falla' : ''}">${m.rol === 'user' ? esc(m.texto) : ayudaTexto(m.texto)}</div>`).join('')
      + (AYUDA.esperando ? '<div class="ayuda-msj bot espera">Escribiendo…</div>' : '');
    $('.ayuda-limpiar', fondo).hidden = !AYUDA.mensajes.length || AYUDA.esperando;
    form.querySelector('button').disabled = AYUDA.esperando;
    // Deja a la vista el inicio de la respuesta nueva (o el final, mientras se escribe)
    const ultimo = lista.lastElementChild;
    if (ultimo && AYUDA.mensajes.length) lista.scrollTop = AYUDA.esperando ? lista.scrollHeight : Math.max(0, ultimo.offsetTop - lista.offsetTop - 60);
  };
  const preguntar = async texto => {
    texto = String(texto || '').trim();
    if (!texto || AYUDA.esperando) return;
    AYUDA.mensajes.push({ rol: 'user', texto });
    AYUDA.esperando = true;
    pintarMsjs();
    let respuesta = null, falla = null;
    try {
      const { data, error } = await sb.functions.invoke('ayuda', {
        body: { mensajes: AYUDA.mensajes.filter(m => !m.falla).slice(-12).map(m => ({ rol: m.rol, texto: m.texto })) },
      });
      if (error) throw error;
      if (data && data.respuesta) respuesta = data.respuesta;
      else falla = AYUDA_FALLAS[data && data.error] || 'No pude responder. Intenta de nuevo.';
    } catch (e) {
      console.error(e);
      falla = /Failed to fetch|NetworkError|Load failed|Failed to send/i.test((e && e.message) || '') ? 'Sin conexión a internet. Revisa la señal e intenta de nuevo.' : 'No pude conectar con la ayuda. Intenta de nuevo en un momento.';
    }
    AYUDA.esperando = false;
    AYUDA.mensajes.push(falla ? { rol: 'assistant', texto: falla, falla: true } : { rol: 'assistant', texto: respuesta });
    if ($('.ayuda-fondo')) pintarMsjs();
  };

  // Con el teclado del celular abierto, el diálogo se ajusta a lo que queda visible
  const vv = window.visualViewport;
  const ajustar = () => { if (vv) Object.assign(fondo.style, { top: vv.offsetTop + 'px', height: vv.height + 'px' }); };
  const tecla = e => { if (e.key === 'Escape') cerrar(); };
  const cerrar = () => {
    if (vv) { vv.removeEventListener('resize', ajustar); vv.removeEventListener('scroll', ajustar); }
    document.removeEventListener('keydown', tecla);
    fondo.remove();
    const b = $('#ayuda-burbuja');
    b && b.focus({ preventScroll: true });
  };
  if (vv) { vv.addEventListener('resize', ajustar); vv.addEventListener('scroll', ajustar); ajustar(); }
  document.addEventListener('keydown', tecla);

  fondo.addEventListener('click', e => {
    const s = e.target.closest('[data-sugerencia]');
    if (s) preguntar(s.dataset.sugerencia);
    else if (e.target === fondo || e.target.closest('.ayuda-cerrar')) cerrar();
    else if (e.target.closest('.ayuda-limpiar')) { AYUDA.mensajes = []; pintarMsjs(); }
  });
  const crecer = () => { campo.style.height = 'auto'; campo.style.height = Math.min(120, campo.scrollHeight + 2) + 'px'; };
  campo.addEventListener('input', crecer);
  campo.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  form.onsubmit = e => {
    e.preventDefault();
    const t = campo.value;
    if (!t.trim() || AYUDA.esperando) return;
    campo.value = '';
    crecer();
    preguntar(t);
  };
  pintarMsjs();
  $('.ayuda-cerrar', fondo).focus({ preventScroll: true });
}
/* ---------- fin de Ayuda ---------- */

/* ---------- Inicio de sesión ---------- */
function pantallaLogin() {
  $('#app').innerHTML = `<div class="login-fondo"><div class="login">
    <img src="icons/logo-oscuro.png" alt="Outlet Prime">
    <h1>Panel del live</h1>
    <form id="f-login" class="formulario">
      <label>Correo<input name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-marca btn-grande">Entrar</button>
    </form></div></div>`;
  $('#f-login').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const ok = await accion(async () => {
      const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
      if (error) throw error;
      return true;
    });
    if (ok) arrancar();
  };
}
async function leerUsuario() {
  const { data } = await sb.auth.getSession();
  const u = data.session && data.session.user;
  return u ? { nombre: (u.user_metadata && u.user_metadata.nombre) || u.email.split('@')[0], email: u.email } : null;
}
async function arrancar() {
  usuario = await leerUsuario();
  if (!usuario) return pantallaLogin();
  try { ROL = await rpc('mi_rol'); }
  catch (e) {
    console.error(e);
    // Si la base todavía no tiene niveles instalados, todos siguen como antes
    const m = (e && e.message) || '';
    ROL = (e && e.code === 'PGRST202') || /mi_rol|schema cache|does not exist/i.test(m) ? 'duena' : null;
  }
  if (!ROL) return pantallaSinAcceso();
  TIENE_COMENTARIOS = !(await sb.from('live_dm').select('id', { head: true, count: 'exact' }).limit(1)).error;
  if (ROL === 'live' && !location.hash) vista = 'acomodo';
  if (ROL === 'presentadora') vista = vista === 'ajustes' ? 'ajustes' : 'dm';
  if (ROL === 'resurtido') vista = vista === 'ajustes' ? 'ajustes' : 'resurtir';
  if (vista === 'resurtir' && !puede.verResurtido()) vista = 'vivo';
  if (!VISTAS.filter(vistaVisible).some(v => v.id === vista) && !OCULTAS.includes(vista)) vista = 'vivo';
  montar();
  montarAyuda();
  pintar(true);
}
function pantallaSinAcceso() {
  $('#app').innerHTML = `<div class="login-fondo"><div class="login">
    <img src="icons/logo-oscuro.png" alt="Outlet Prime">
    <h1>Tu cuenta todavía no tiene acceso</h1>
    <p style="color:#bdbdbd;text-align:center">${esc(usuario.email)}<br>Pídele a una dueña que te asigne un nivel en <b>Panel → Ajustes → Equipo</b>.</p>
    <button class="btn btn-marca btn-grande" onclick="location.reload()">Volver a revisar</button>
    <button class="btn btn-secundario" id="salir-sa">Cerrar sesión</button>
  </div></div>`;
  $('#salir-sa').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}

/* iPhone: al cerrarse el teclado, la barra de pestañas a veces se queda flotando a media pantalla.
 * Un movimiento mínimo de la página obliga al teléfono a volver a colocarla abajo. */
function reacomodarPantalla() {
  requestAnimationFrame(() => { window.scrollBy(0, 1); requestAnimationFrame(() => window.scrollBy(0, -1)); });
}
const esCampo = el => !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName || '');
document.addEventListener('focusout', e => {
  if (!esCampo(e.target)) return;
  setTimeout(() => { if (!esCampo(document.activeElement)) reacomodarPantalla(); }, 150);
});
if (window.visualViewport) {
  let altoAntes = window.visualViewport.height;
  window.visualViewport.addEventListener('resize', () => {
    const alto = window.visualViewport.height;
    if (alto > altoAntes + 80) reacomodarPantalla();   // el teclado se acaba de cerrar
    altoAntes = alto;
  });
}

/* Se actualiza sola cada 4 segundos (sin interrumpir si alguien está escribiendo o hay una ventana abierta). */
setInterval(() => {
  if (!usuario || document.visibilityState !== 'visible' || ocupado || $('.modal-fondo')) return;
  if (capturandoDesde && Date.now() - capturandoDesde < 120000) return; // la cámara está abierta
  const foco = document.activeElement;
  if (foco && /INPUT|TEXTAREA|SELECT/.test(foco.tagName)) return;
  if (['dm', 'vivo', 'casilleros', 'acomodo', 'whatsapp', 'host', 'resurtir'].includes(vista)) pintar();
}, 4000);
window.addEventListener('hashchange', () => { const v = location.hash.replace('#', ''); if (v !== vista && existeVista(v)) irA(v); });

arrancar().catch(e => { console.error(e); $('#app').innerHTML = `<div class="vacio">${IC.alerta}<h2>No se pudo iniciar</h2><p>${esc(traducirError(e))}</p></div>`; });
</script>
