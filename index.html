function hoja(filas, anchos) {
  const ws = XLSX.utils.json_to_sheet(filas);
  if (anchos) ws['!cols'] = anchos.map(w => ({ wch: w }));
  return ws;
}
function guardarLibro(wb, nombre) {
  const datos = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([datos], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  return compartirArchivos([{ blob, nombre }]);
}
function filaClienta(c) {
  const a = idx.activaClienta(c.id);
  return {
    Nombre: c.nombre, Apellidos: c.apellidos, 'Fecha de registro': c.fecha_registro ? aFecha(c.fecha_registro) : '', Teléfono: c.telefono, Correo: c.correo,
    Calle: c.calle, Número: c.numero, Interior: c.interior, Colonia: c.colonia, 'C.P.': c.cp, Ciudad: c.ciudad, Estado: c.estado,
    Referencia: c.referencia, 'Caja actual': a ? a.caja : '', Registró: c.creado_por,
  };
}
function exportarCorte(rango, rep) {
  const cats = idx.categorias(true);
  const wb = XLSX.utils.book_new();
  const resumen = [
    { Concepto: 'Periodo', Valor: `${fechaCorta(rango[0])} al ${fechaCorta(rango[1])}` },
    { Concepto: 'Generado', Valor: `${fechaHora(new Date())} por ${usuario.nombre}` },
    { Concepto: 'Total vendido', Valor: rep.total },
    { Concepto: 'Pedidos', Valor: rep.pedidos.length },
    { Concepto: 'Prendas', Valor: rep.prendas },
    { Concepto: 'Clientas que compraron', Valor: rep.clientas },
    { Concepto: 'Clientas nuevas', Valor: rep.nuevas },
    { Concepto: 'Cajas enviadas', Valor: rep.envios.length },
    { Concepto: 'Costo de envíos', Valor: rep.costoEnvios },
    { Concepto: '', Valor: '' },
    ...Object.values(rep.porCat).flatMap(c => [{ Concepto: `${c.nombre} (prendas)`, Valor: c.cantidad }, { Concepto: `${c.nombre} (importe)`, Valor: c.importe }]),
  ];
  XLSX.utils.book_append_sheet(wb, hoja(resumen, [28, 34]), 'Resumen');

  const pedidos = rep.pedidos.map(p => {
    const a = idx.asig(p.asignacion_id) || {};
    const cl = idx.clienta(p.clienta_id) || {};
    const fila = { Fecha: new Date(p.fecha), Caja: a.caja || p.caja, Clienta: nombreCompleto(cl), Teléfono: cl.telefono || '' };
    for (const c of cats) {
      const its = (p.items || []).filter(i => i.cat === c.id);
      fila[c.nombre] = its.reduce((s, i) => s + i.cantidad, 0);
      if (c.editable) fila[`${c.nombre} importe`] = its.reduce((s, i) => s + i.precio * i.cantidad, 0);
    }
    Object.assign(fila, {
      Prendas: p.prendas, Total: Number(p.total), Estado: a.estado === 'enviada' ? 'Enviado' : 'En caja',
      'Fecha de envío': a.enviada_en ? new Date(a.enviada_en) : '', Video: p.video ? 'Sí' : 'No', Notas: p.notas || '', Registró: p.creado_por || '',
    });
    return fila;
  });
  XLSX.utils.book_append_sheet(wb, hoja(pedidos.length ? pedidos : [{ Aviso: 'Sin pedidos en este periodo' }]), 'Pedidos');

  const envios = rep.envios.map(a => {
    const cl = idx.clienta(a.clienta_id) || {};
    const ps = idx.pedidosDe(a.id);
    const r = resumenPedidos(ps);
    return {
      'Fecha de envío': new Date(a.enviada_en), Caja: a.caja, Clienta: nombreCompleto(cl), Teléfono: cl.telefono, Dirección: direccion(cl), Referencia: cl.referencia,
      Paquetería: a.paqueteria, Guía: a.guia, 'Peso (kg)': a.peso_kg, Medidas: a.medidas, 'Costo de envío': a.costo_envio,
      Pedidos: ps.length, Prendas: r.prendas, 'Total mercancía': r.total, 'Asignada el': new Date(a.asignada_en), 'Días en caja': Math.round((inicioDia(a.enviada_en) - inicioDia(a.asignada_en)) / 864e5), Envió: a.enviada_por,
    };
  });
  XLSX.utils.book_append_sheet(wb, hoja(envios.length ? envios : [{ Aviso: 'Sin envíos en este periodo' }]), 'Envíos');

  const pendientes = D.asignaciones.filter(a => a.estado === 'activa').sort((x, y) => ordenNatural(x.caja, y.caja)).map(a => {
    const cl = idx.clienta(a.clienta_id) || {};
    const r = resumenPedidos(idx.pedidosDe(a.id));
    const st = estadoAsig(a);
    return { Caja: a.caja, Clienta: nombreCompleto(cl), Teléfono: cl.telefono, 'Asignada el': new Date(a.asignada_en), Días: st.dias, Estado: st.nivel === 'vencida' ? 'VENCIDA' : st.nivel === 'aviso' ? 'Por vencer' : 'En tiempo', Prendas: r.prendas, Total: r.total };
  });
  XLSX.utils.book_append_sheet(wb, hoja(pendientes.length ? pendientes : [{ Aviso: 'No hay cajas ocupadas' }]), 'Cajas sin enviar');

  guardarLibro(wb, `Corte ${fechaISO(rango[0])} a ${fechaISO(rango[1])}.xlsx`);
}
function exportarClientas() {
  const wb = XLSX.utils.book_new();
  const filas = D.clientas.slice().sort((a, b) => ordenNatural(nombreCompleto(a), nombreCompleto(b))).map(filaClienta);
  XLSX.utils.book_append_sheet(wb, hoja(filas.length ? filas : [{ Aviso: 'Sin clientas' }]), 'Clientas');
  guardarLibro(wb, `Clientas ${fechaISO()}.xlsx`);
}

    await accion(async () => { await store.borrarTodo(); D.cargado = 0; }, 'Borrando…');
    toast('Datos borrados');
    ir('cajas');
  };
}

/* ---------- Administrar cajas y QR ---------- */
function vistaAdminCajas() {
  titulo('Cajas y QR', 'ajustes');
  const cajas = cajasOrdenadas();
  vista().innerHTML = `
    <div class="tarjeta">
      <b>Crear cajas</b>
      <form id="f-crear" class="formulario">
        <div class="dos"><label>Letra desde<input name="l1" maxlength="1" value="A" autocapitalize="characters"></label><label>Letra hasta<input name="l2" maxlength="1" value="${cajas.length ? 'A' : 'B'}" autocapitalize="characters"></label></div>
        <div class="dos"><label>Número desde<input name="n1" type="number" min="0" inputmode="numeric" value="1"></label><label>Número hasta<input name="n2" type="number" min="0" inputmode="numeric" value="10"></label></div>
        <p class="nota" id="vista-previa"></p>
        <button class="btn btn-primario">Crear cajas</button>
      </form>
      <form id="f-una" class="en-linea"><label>O una sola caja<input name="codigo" placeholder="Ej. C7" autocapitalize="characters"></label><button class="btn btn-secundario">Crear</button></form>
    </div>
    <h3 class="seccion">Etiquetas QR</h3>
    <p class="nota">Selecciona las cajas y genera sus etiquetas. "Imprimir" abre la impresión del teléfono; "Guardar como imagen" crea hojas tamaño carta que puedes mandar a imprimir desde Fotos o la computadora.</p>
    <div class="acciones-fila">
      <label class="interruptor"><input type="checkbox" id="todas"><span>Seleccionar todas</span></label>
    </div>
    <div class="rejilla">${cajas.map(c => {
      const a = idx.activaCaja(c.id);
      const usada = D.asignaciones.some(x => x.caja === c.id);
      return `<label class="caja-card seleccionable ${a ? 'nivel-ok' : 'nivel-libre'}"><input type="checkbox" class="sel-caja" value="${esc(c.id)}"><span class="caja-codigo">${esc(c.id)}</span><span class="caja-nombre ${a ? '' : 'libre'}">${a ? 'Ocupada' : 'Libre'}</span>${usada ? '' : `<button type="button" class="borrar-caja" data-borrar="${esc(c.id)}" aria-label="Borrar caja ${esc(c.id)}">${IC.basura}</button>`}</label>`;
    }).join('') || '<p class="nota">Aún no hay cajas.</p>'}</div>
    <div class="pie-total">
      <div><small id="n-sel">0 seleccionadas</small></div>
      ${CFG.vistaPrevia ? '' : '<button class="btn btn-secundario" id="imprimir">Imprimir</button>'}
      <button class="btn btn-primario" id="imagen">Guardar como imagen</button>
    </div>`;

  const f = $('#f-crear');
  const codigosRango = () => {
    const l1 = (f.l1.value || 'A').toUpperCase().charCodeAt(0), l2 = (f.l2.value || f.l1.value || 'A').toUpperCase().charCodeAt(0);
    const n1 = parseInt(f.n1.value, 10), n2 = parseInt(f.n2.value, 10);
    if (!(l1 >= 65 && l1 <= 90 && l2 >= l1 && l2 <= 90 && n2 >= n1 && n1 >= 0) || (l2 - l1 + 1) * (n2 - n1 + 1) > 500) return [];
    const out = [];
    for (let l = l1; l <= l2; l++) for (let n = n1; n <= n2; n++) out.push(String.fromCharCode(l) + n);
    return out;
  };
  const previa = () => {
    const cs = codigosRango();
    const nuevas = cs.filter(c => !idx.caja(c));
    $('#vista-previa').textContent = cs.length ? `${cs[0]} a ${cs[cs.length - 1]}: ${nuevas.length} cajas nuevas${cs.length - nuevas.length ? ` (${cs.length - nuevas.length} ya existen)` : ''}` : 'Revisa el rango (máximo 500 cajas).';
  };
  f.oninput = previa; previa();
  const crear = async codigos => {
    const nuevas = codigos.filter(c => !idx.caja(c));
    if (!nuevas.length) { toast('Esas cajas ya existen.', 'error'); return; }
    const ok = await accion(async () => {
      let i = 0;
      for (const c of nuevas) { espera.mostrar('Creando cajas…', i++ / nuevas.length); await store.insert('cajas', { id: c, creada_en: new Date().toISOString() }); }
      D.cargado = 0;
      return true;
    }, 'Creando cajas…');
    if (ok) { toast(`${nuevas.length} cajas creadas`); navegar(); }
  };
  f.onsubmit = e => { e.preventDefault(); crear(codigosRango()); };
  $('#f-una').onsubmit = e => {
    e.preventDefault();
    const c = e.target.codigo.value.trim().toUpperCase();
    if (!/^[A-Z0-9-]{1,12}$/.test(c)) { toast('Usa solo letras y números (ej. C7).', 'error'); return; }
    crear([c]);
  };
  $$('[data-borrar]').forEach(b => {
    b.onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      const id = b.dataset.borrar;
      if (!(await confirmar(`¿Borrar la caja ${esc(id)}? Nunca se ha usado.`, { titulo: 'Borrar caja', si: 'Borrar', peligro: true }))) return;
      const ok = await accion(async () => { await store.remove('cajas', id); D.cargado = 0; return true; }, 'Borrando…');
      if (ok) { toast(`Caja ${id} borrada`); navegar(); }
    };
  });
  const seleccion = () => $$('.sel-caja').filter(x => x.checked).map(x => x.value);
  const contar = () => { $('#n-sel').textContent = `${seleccion().length} seleccionadas`; };
  $$('.sel-caja').forEach(x => { x.onchange = contar; });
  $('#todas').onchange = e => { $$('.sel-caja').forEach(x => { x.checked = e.target.checked; }); contar(); };
  if ($('#imprimir')) $('#imprimir').onclick = () => { const s = seleccion(); if (!s.length) return toast('Selecciona al menos una caja.', 'error'); imprimirEtiquetas(s); };
  $('#imagen').onclick = () => { const s = seleccion(); if (!s.length) return toast('Selecciona al menos una caja.', 'error'); guardarEtiquetasImagen(s); };
}

function imprimirEtiquetas(codigos) {
  let area = $('#zona-impresion');
  if (!area) { area = document.createElement('div'); area.id = 'zona-impresion'; document.body.appendChild(area); }
  area.innerHTML = codigos.map(c => `<div class="etiqueta"><img src="icons/logo-claro.png" alt="">${qrSVG(textoQR(c), 300)}<b>${esc(c)}</b></div>`).join('');
  setTimeout(() => window.print(), 100);
}
const LOGO_ETIQUETA = new Image();
LOGO_ETIQUETA.src = 'icons/logo-claro.png';
function guardarEtiquetasImagen(codigos) {
  // Hojas tamaño carta a 150 ppp: 3 columnas × 4 filas = 12 etiquetas por hoja.
  const W = 1275, H = 1650, cols = 3, filas = 4, margen = 60;
  const cw = (W - margen * 2) / cols, ch = (H - margen * 2) / filas;
  const archivos = [];
  for (let i = 0; i < codigos.length; i += cols * filas) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    codigos.slice(i, i + cols * filas).forEach((cod, j) => {
      const x = margen + (j % cols) * cw, y = margen + Math.floor(j / cols) * ch;
      ctx.strokeStyle = '#bbb'; ctx.setLineDash([8, 8]); ctx.lineWidth = 2; ctx.strokeRect(x + 6, y + 6, cw - 12, ch - 12); ctx.setLineDash([]);
      let arriba = 22;
      if (LOGO_ETIQUETA.complete && LOGO_ETIQUETA.naturalWidth) {
        const lw = cw * 0.42, lh = lw * LOGO_ETIQUETA.naturalHeight / LOGO_ETIQUETA.naturalWidth;
        ctx.drawImage(LOGO_ETIQUETA, x + (cw - lw) / 2, y + 18, lw, lh);
        arriba = 18 + lh + 6;
      }
      const q = ch - arriba - 78;
      dibujarQR(ctx, textoQR(cod), x + (cw - q) / 2, y + arriba, q);
      ctx.fillStyle = '#000'; ctx.textAlign = 'center';
      ctx.font = 'bold 60px -apple-system, Helvetica, Arial, sans-serif';
      ctx.fillText(cod, x + cw / 2, y + arriba + q + 58);
    });
    archivos.push({ blob: dataUrlABlob(c.toDataURL('image/png')), nombre: `Etiquetas QR ${Math.floor(i / (cols * filas)) + 1}.png` });
  }
  compartirArchivos(archivos);
}

function pantallaLogin() {
  document.title = CFG.nombreNegocio;
  $('#app').innerHTML = `
    <div class="login-fondo"><div class="login">
      <img class="login-logo" src="icons/logo-oscuro.png" alt="${esc(CFG.nombreNegocio)}">
      <form id="f-login" class="formulario">

        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primario btn-grande">Entrar</button>
      </form>
    </div></div>`;
  $('#f-login').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const u = await accion(() => store.login(f.email.value.trim(), f.password.value), 'Entrando…');
    if (u) { usuario = u; arrancar(); }

async function arrancar() {
  montarShell();
  await navegar();
  revisarAlertas();
}

async function iniciar() {
  try {
    const nube = CFG.supabaseUrl && CFG.supabaseAnonKey;
    store = nube ? new SupaStore(CFG.supabaseUrl, CFG.supabaseAnonKey) : new LocalStore();
    try { await store.init(); } catch (e) {
      if (nube) throw e;
      store = new MemStore();
      await store.init();
    }
    if (window.sembrarEjemplo) await window.sembrarEjemplo(store);
    usuario = await store.usuario();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="vacio">${IC.alerta}<p>No se pudo iniciar la app: ${esc(traducirError(e))}</p><button class="btn btn-primario" onclick="location.reload()">Reintentar</button></div>`;
    return;
  }
  window.addEventListener('hashchange', navegar);
  if (CFG.vistaPrevia) {
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#"]');
      if (!a || e.defaultPrevented || a.getAttribute('href') === '#') return;
      e.preventDefault();
      ir(a.getAttribute('href').replace(/^#\/?/, ''));
    });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !usuario || !$('#vista')) return;
    D.cargado = 0;
    if (rutaRecargable && !$('.modal-fondo') && !$('.espera')) navegar().then(() => { if (Date.now() - ultimaAlerta > 3 * 3600e3) revisarAlertas(); });
  });
  if (!usuario) pantallaLogin(); else arrancar();

  if (!CFG.vistaPrevia && 'serviceWorker' in navigator && window.self === window.top && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
document.addEventListener('DOMContentLoaded', iniciar);

</script>
