<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Outlet Prime Cajas</title>
<style>
:root {
  --fondo: #f3f3f2;
  --superficie: #ffffff;
  --superficie-2: #e9e9e7;
  --texto: #141414;
  --texto-2: #66645f;
  --borde: #dcdbd8;
  --primario: #111111;
  --primario-texto: #ffffff;
  --primario-suave: #e6e6e4;
  --marca: #ce091e;
  --marca-texto: #ffffff;
  --ok: #2f7d4f;
  --ok-suave: #e1f1e6;
  --aviso: #a86400;
  --aviso-suave: #fbeed6;
  --vencida: #b8322a;
  --vencida-suave: #f9e1de;
  --libre: #8a8278;
  --sombra: 0 1px 2px rgba(40, 30, 20, .06), 0 2px 8px rgba(40, 30, 20, .05);
  --radio: 14px;
  --sup: env(safe-area-inset-top, 0px);
  --inf: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0e0e0e;
    --superficie: #1b1b1b;
    --superficie-2: #272727;
    --texto: #f1f1ef;
    --texto-2: #a3a19c;
    --borde: #333333;
    --primario: #f1f1ef;
    --primario-texto: #111111;
    --primario-suave: #262626;
    --marca: #e5263a;
    --marca-texto: #ffffff;
    --ok: #63c08a;
    --ok-suave: #1d3326;
    --aviso: #e7a948;
    --aviso-suave: #3a2d17;
    --vencida: #f0776d;
    --vencida-suave: #3d2120;
    --libre: #8f887f;
    --sombra: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #0e0e0e;
  --superficie: #1b1b1b;
  --superficie-2: #272727;
  --texto: #f1f1ef;
  --texto-2: #a3a19c;
  --borde: #333333;
  --primario: #f1f1ef;
  --primario-texto: #111111;
  --primario-suave: #262626;
  --marca: #e5263a;
  --marca-texto: #ffffff;
  --ok: #63c08a;
  --ok-suave: #1d3326;
  --aviso: #e7a948;
  --aviso-suave: #3a2d17;
  --vencida: #f0776d;
  --vencida-suave: #3d2120;
  --libre: #8f887f;
  --sombra: none;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  overscroll-behavior-y: none;
}
a { color: var(--primario); text-decoration: none; }
svg { width: 22px; height: 22px; flex: none; }
h1, h2, h3 { margin: 0; }
small { color: var(--texto-2); font-size: 13px; }
.nota { color: var(--texto-2); font-size: 14px; margin: 8px 0; }
.centro { text-align: center; }
.intro { margin: 4px 0 14px; }

/* Barra superior y pestañas */
.barra-sup {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 6px;
  padding: calc(var(--sup) + 8px) 12px 8px;
  background: #000; color: #fff;
  border-bottom: 3px solid var(--marca);
}
.logo-barra { height: 40px; width: auto; display: block; }
.barra-sup h1 { flex: 1; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-icono { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: #fff; }
.btn-icono:active { background: rgba(255, 255, 255, .15); }
.aviso-demo { background: var(--aviso-suave); color: var(--aviso); font-size: 13px; text-align: center; padding: 6px 12px; }

#vista { padding: 14px 16px calc(var(--inf) + 110px); max-width: 720px; margin: 0 auto; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 4px calc(var(--inf) + 6px);
  background: color-mix(in srgb, var(--superficie) 92%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--borde);
}
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--texto-2); font-size: 11px; font-weight: 500; }
.tabs a.activa { color: var(--marca); }
.tab-escanear b { display: grid; place-items: center; width: 54px; height: 54px; margin-top: -24px; border-radius: 50%; background: var(--marca); color: var(--marca-texto); box-shadow: 0 4px 14px rgba(206, 9, 30, .35); }
.tab-escanear b svg { width: 26px; height: 26px; }

/* Botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 12px; border: 0;
  font: inherit; font-weight: 600; cursor: pointer; text-align: center;
  background: var(--superficie-2); color: var(--texto);
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; }
.btn-primario { background: var(--primario); color: var(--primario-texto); }
.btn-secundario { background: var(--superficie); color: var(--texto); border: 1px solid var(--borde); }
.btn-peligro { background: var(--vencida); color: #fff; }
.btn-claro { background: rgba(255, 255, 255, .92); color: #111; }
.btn-grande { width: 100%; min-height: 52px; font-size: 17px; }
.btn-mini { min-height: 36px; padding: 0 12px; font-size: 14px; background: var(--superficie-2); }
.btn-mini svg { width: 18px; height: 18px; }
.btn-icono-solo { display: inline-grid; place-items: center; min-width: 36px; min-height: 36px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--texto-2); cursor: pointer; }
.btn-icono-solo svg { width: 19px; height: 19px; }
.acciones { display: grid; gap: 10px; margin: 14px 0; }
.acciones-fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; }

/* Banners y chips */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radio); margin-bottom: 12px; font-size: 15px; }
.banner small { color: inherit; opacity: .85; }
.banner-ok { background: var(--ok-suave); color: var(--ok); }
.banner-aviso { background: var(--aviso-suave); color: var(--aviso); }
.banner-vencida { background: var(--vencida-suave); color: var(--vencida); }
.banner-libre { background: var(--primario-suave); color: var(--primario); }
.chip { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--superficie-2); color: var(--texto-2); white-space: nowrap; }
.chip-ok { background: var(--ok-suave); color: var(--ok); }
.chip-aviso { background: var(--aviso-suave); color: var(--aviso); }
.chip-vencida { background: var(--vencida-suave); color: var(--vencida); }
.texto-vencida { color: var(--vencida); font-weight: 600; }

/* Filtros y buscador */
.filtros { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px 2px; scrollbar-width: none; }
.filtros::-webkit-scrollbar { display: none; }
.filtro { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--superficie); border: 1px solid var(--borde); color: var(--texto); font-size: 14px; font-weight: 500; }
.filtro b { color: var(--texto-2); font-weight: 600; margin-left: 2px; }
.filtro.activo { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
.filtro.activo b { color: inherit; opacity: .7; }
.buscador { width: 100%; margin-bottom: 12px; }

/* Rejilla de cajas */
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 10px; }
.caja-card {
  position: relative; display: flex; flex-direction: column; gap: 2px; min-height: 92px; padding: 10px 10px 10px 13px;
  border-radius: var(--radio); background: var(--superficie); box-shadow: var(--sombra); color: var(--texto);
  border: 1px solid var(--borde); border-left: 5px solid var(--libre); text-align: left; font: inherit; cursor: pointer; overflow: hidden;
}
.caja-card.nivel-ok { border-left-color: var(--ok); }
.caja-card.nivel-aviso { border-left-color: var(--aviso); background: color-mix(in srgb, var(--aviso-suave) 50%, var(--superficie)); }
.caja-card.nivel-vencida { border-left-color: var(--vencida); background: color-mix(in srgb, var(--vencida-suave) 60%, var(--superficie)); }
.caja-codigo { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
.caja-nombre { font-size: 13px; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.caja-nombre.libre { color: var(--libre); font-weight: 500; }
.caja-meta { font-size: 12px; color: var(--texto-2); margin-top: auto; }
.nivel-vencida .caja-meta { color: var(--vencida); font-weight: 600; }
.seleccionable input { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; accent-color: var(--primario); }
.seleccionable:has(input:checked) { outline: 2px solid var(--primario); }
.borrar-caja { position: absolute; right: 4px; bottom: 4px; border: 0; background: none; color: var(--texto-2); padding: 6px; cursor: pointer; }
.borrar-caja svg { width: 17px; height: 17px; }

/* Listas y tarjetas */
.lista { display: grid; gap: 8px; }
.fila {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  padding: 12px 14px; border-radius: var(--radio); background: var(--superficie); border: 1px solid var(--borde);
  color: var(--texto); font: inherit; text-align: left; cursor: pointer; margin-bottom: 8px;
}
.lista .fila { margin: 0; }
.fila > span:first-child { display: flex; flex-direction: column; min-width: 0; }
.fila b { overflow: hidden; text-overflow: ellipsis; }
.fila.deshabilitada { opacity: .55; }
.tarjeta { padding: 14px; border-radius: var(--radio); background: var(--superficie); border: 1px solid var(--borde); box-shadow: var(--sombra); margin-bottom: 12px; }
.tarjeta p { margin: 6px 0 0; }
.clienta-nombre { font-size: 19px; display: block; margin-bottom: 2px; }
.clienta small { display: block; }
.clienta .ref { margin-top: 4px; font-style: italic; }
.clienta-botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.mini-clienta b { display: block; font-size: 17px; }
.totales { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
.totales > div { padding: 10px 12px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--borde); }
.totales small { display: block; }
.totales b { font-size: 18px; }
.seccion { font-size: 13px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--texto-2); margin: 22px 0 10px; }
.pedido-cabeza { display: flex; justify-content: space-between; gap: 10px; }
.pedido-pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pedido-pie > span { display: flex; gap: 6px; align-items: center; }
.datos { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 4px; padding: 0 4px; font-size: 15px; }
.datos dt { color: var(--texto-2); }
.datos dd { margin: 0; overflow-wrap: anywhere; }
.bloque-historial { padding: 12px; border-radius: var(--radio); background: var(--superficie-2); margin-bottom: 12px; }
.bloque-historial > small { display: block; margin: 2px 0 10px; }
.bloque-historial .tarjeta { margin-bottom: 8px; box-shadow: none; }
.historial-cabeza { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.envio { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--superficie); margin-bottom: 8px; }
.envio > span { flex: 1; }
.plegable { margin-top: 18px; }
.plegable summary { cursor: pointer; color: var(--texto-2); font-weight: 600; padding: 8px 0; }
.lista-alerta { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.lista-alerta a { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--vencida-suave); color: var(--texto); }

/* Formularios */
.formulario { display: grid; gap: 12px; }
.formulario .seccion { margin: 10px 0 -2px; }
label { display: grid; gap: 5px; font-size: 14px; font-weight: 600; color: var(--texto-2); }
input, select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--borde);
  background: var(--superficie); color: var(--texto); font: inherit; font-size: 16px; font-weight: 400;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primario); outline-offset: 0; border-color: transparent; }
input[type="checkbox"] { width: 22px; min-height: 22px; height: 22px; accent-color: var(--primario); }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.en-linea { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; }
.en-linea label { flex: 1; }
.interruptor { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--texto); }
.campo-suelto { margin-top: 14px; }
.subir-archivo {
  display: block; padding: 18px; border-radius: var(--radio); border: 2px dashed var(--borde);
  background: var(--superficie); text-align: center; cursor: pointer; color: var(--texto); margin-bottom: 4px;
}
.subir-archivo > span { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.subir-archivo svg { width: 34px; height: 34px; color: var(--marca); }
.subir-archivo img, .subir-archivo video { width: 100%; max-height: 300px; object-fit: contain; border-radius: 10px; background: #000; }
.subir-archivo.invalido { border-color: var(--vencida); background: var(--vencida-suave); }

/* Pedido */
.categorias { display: grid; gap: 8px; }
.cat { padding: 12px 14px; border-radius: var(--radio); background: var(--superficie); border: 1px solid var(--borde); }
.cat-fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cat-fila > span { display: flex; flex-direction: column; }
.subtotal { display: block; text-align: right; margin-top: 4px; }
.subtotal:empty { display: none; }
.contador { display: flex; align-items: center; border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; }
.contador button { width: 44px; height: 44px; border: 0; background: var(--superficie-2); color: var(--texto); font-size: 22px; cursor: pointer; }
.contador input { width: 52px; min-height: 44px; border: 0; border-radius: 0; text-align: center; font-weight: 700; padding: 0; -moz-appearance: textfield; }
.contador input::-webkit-inner-spin-button { -webkit-appearance: none; }
.piezas { display: grid; gap: 8px; margin-top: 8px; }
.pieza { display: grid; grid-template-columns: 64px 1fr 40px; gap: 8px; align-items: center; font-size: 14px; color: var(--texto-2); }
.pie-total {
  position: fixed; left: 0; right: 0; bottom: calc(var(--inf) + 66px); z-index: 15;
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--superficie); border-top: 1px solid var(--borde); box-shadow: 0 -4px 16px rgba(0, 0, 0, .06);
}
.pie-total > div { flex: 1; display: flex; flex-direction: column; }
.pie-total b { font-size: 22px; }
#vista:has(.pie-total) { padding-bottom: calc(var(--inf) + 180px); }

/* Reportes */
.periodo { margin: 4px 0 12px; }
.rango { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { padding: 12px 14px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--borde); }
.kpi small { display: block; }
.kpi b { font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi-grande { grid-column: 1 / -1; background: var(--primario); border-color: var(--primario); }
.kpi-grande small, .kpi-grande b { color: var(--primario-texto); }
.kpi-grande b { font-size: 30px; }
.tabla { width: 100%; border-collapse: collapse; background: var(--superficie); border-radius: var(--radio); overflow: hidden; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.tabla th, .tabla td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--borde); }
.tabla th:first-child, .tabla td:first-child { text-align: left; }
.tabla th { font-size: 13px; color: var(--texto-2); font-weight: 600; }
.tabla tfoot td { font-weight: 700; border-bottom: 0; }

/* Ajustes */
.precio-fila { display: grid; grid-template-columns: 1fr 100px auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.precio-fila .nota { margin: 0; font-size: 12px; }

/* Vacío, carga, avisos, modales */
.vacio { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 50px 20px; color: var(--texto-2); }
.vacio svg { width: 46px; height: 46px; }
.vacio h2 { color: var(--texto); font-size: 20px; }
.cargando { display: grid; place-items: center; padding: 70px 0; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--borde); border-top-color: var(--marca); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.toast {
  position: fixed; left: 16px; right: 16px; top: calc(var(--sup) + 12px); z-index: 100; margin: 0 auto; max-width: 480px;
  padding: 13px 16px; border-radius: 12px; background: var(--texto); color: var(--fondo); font-weight: 500;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .2); transform: translateY(-20px); opacity: 0; transition: .25s;
}
.toast.visible { transform: none; opacity: 1; }
.toast-error { background: var(--vencida); color: #fff; }
.modal-fondo { position: fixed; inset: 0; z-index: 75; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .4); opacity: 0; transition: opacity .2s; }
.modal-fondo.visible { opacity: 1; }
.modal { width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; padding: 20px 18px calc(var(--inf) + 16px); border-radius: 20px 20px 0 0; background: var(--superficie); }
@media (min-width: 600px) { .modal-fondo { align-items: center; } .modal { border-radius: 20px; } }
.modal-titulo { font-size: 19px; margin-bottom: 8px; }
.modal-cuerpo p { margin: 6px 0; }
.modal-botones { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; margin-top: 18px; }
.video-modal, .foto-modal { width: 100%; max-height: 65vh; border-radius: 12px; background: #000; object-fit: contain; }
.espera { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(0, 0, 0, .45); padding: 24px; }
.espera-caja { width: 100%; max-width: 320px; padding: 24px; border-radius: 18px; background: var(--superficie); text-align: center; display: grid; justify-items: center; gap: 10px; }
.espera-texto { margin: 0; font-weight: 600; }
.espera-nota { margin: 0; font-size: 13px; color: var(--texto-2); }
.espera-nota:empty { display: none; }
.barra { width: 100%; height: 8px; border-radius: 99px; background: var(--superficie-2); overflow: hidden; }
.barra-relleno { height: 100%; width: 0; background: var(--marca); transition: width .2s; }

/* Escáner */
.escaner { position: fixed; inset: 0; z-index: 70; background: #000; }
.escaner video { width: 100%; height: 100%; object-fit: cover; }
.escaner-marco { position: absolute; left: 50%; top: 45%; width: min(70vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 24px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45); border: 3px solid rgba(255, 255, 255, .9); }
.escaner-arriba { position: absolute; top: calc(var(--sup) + 12px); right: 12px; }
.escaner-abajo { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(var(--inf) + 20px); text-align: center; color: #fff; }
.escaner-msg { margin: 0 0 12px; font-weight: 600; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
.escaner-acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.escaner-acciones label { display: inline-flex; color: #111; font-size: 16px; }

/* Inicio de sesión */
.login-fondo { min-height: 100vh; background: #000; }
.login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 24px; max-width: 420px; margin: 0 auto; }
.login-logo { width: 100%; max-width: 320px; height: auto; margin: 0 auto; display: block; }

<script>
/* Capa de datos.
 * - LocalStore: modo prueba. Todo se guarda en este dispositivo (IndexedDB).
 * - SupaStore: modo real. Base de datos compartida en Supabase (internet).
 * Ambas exponen la misma interfaz, así la app no necesita saber cuál usa.
 */
const TABLAS = ['cajas', 'categorias', 'clientas', 'asignaciones', 'pedidos'];
const BUCKET = 'archivos';

function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}

const CATEGORIAS_INICIALES = [
  { id: 'target', nombre: 'Target', precio: 89, editable: false, activa: true, orden: 1 },
  { id: 'costco', nombre: 'Costco', precio: 289, editable: false, activa: true, orden: 2 },
  { id: 'cremas', nombre: 'Cremas', precio: 189, editable: false, activa: true, orden: 3 },
  { id: 'perfumes', nombre: 'Perfumes', precio: 589, editable: false, activa: true, orden: 4 },
  { id: 'calzado', nombre: 'Calzado', precio: 0, editable: true, activa: true, orden: 5 },
];

/* ---------- Modo prueba: IndexedDB ---------- */
class LocalStore {
  constructor() { this.modo = 'local'; }

  async init() {
    this.db = await new Promise((res, rej) => {
      const req = indexedDB.open('control-cajas', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const t of TABLAS) if (!db.objectStoreNames.contains(t)) db.createObjectStore(t, { keyPath: 'id' });
        if (!db.objectStoreNames.contains('archivos')) db.createObjectStore('archivos', { keyPath: 'id' });
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
    const cats = await this.all('categorias');
    if (!cats.length) for (const c of CATEGORIAS_INICIALES) await this.insert('categorias', c);
  }

  _tx(store, modo, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, modo);
      const r = fn(tx.objectStore(store));
      tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Operación cancelada'));
    });
  }

  async usuario() { return { nombre: localStorage.getItem('demo-nombre') || 'Prueba', email: '' }; }
  async login() { return this.usuario(); }
  async logout() {}
  async cambiarNombre(n) { localStorage.setItem('demo-nombre', n); }

  all(t) { return this._tx(t, 'readonly', s => s.getAll()); }
  async insert(t, row) { const r = { id: uid(), ...row }; await this._tx(t, 'readwrite', s => s.add(r)); return r; }
  async update(t, id, patch) {
    const actual = await this._tx(t, 'readonly', s => s.get(id));
    if (!actual) throw new Error('El registro ya no existe.');
    const r = { ...actual, ...patch };
    await this._tx(t, 'readwrite', s => s.put(r));
    return r;
  }
  remove(t, id) { return this._tx(t, 'readwrite', s => s.delete(id)); }

  async upload(path, blob, onProgress) {
    await this._tx('archivos', 'readwrite', s => s.put({ id: path, blob }));
    onProgress && onProgress(1);
    return path;
  }
  async fileUrl(path) {
    const f = await this._tx('archivos', 'readonly', s => s.get(path));
    return f ? URL.createObjectURL(f.blob) : null;
  }
  async fileBlob(path) {
    const f = await this._tx('archivos', 'readonly', s => s.get(path));
    if (!f) throw new Error('No se encontró el archivo.');
    return f.blob;
  }
  removeFile(path) { return this._tx('archivos', 'readwrite', s => s.delete(path)); }

  async borrarTodo() {
    for (const t of [...TABLAS, 'archivos']) await this._tx(t, 'readwrite', s => s.clear());
    for (const c of CATEGORIAS_INICIALES) await this.insert('categorias', c);
  }
}

/* ---------- Modo real: Supabase ---------- */
class SupaStore {
  constructor(url, key) {
    this.modo = 'nube';
    this.url = url.replace(/\/+$/, '');
    this.key = key;
    this.sb = window.supabase.createClient(this.url, key, { auth: { persistSession: true, autoRefreshToken: true } });
  }
  async init() {}

  async usuario() {
    const { data } = await this.sb.auth.getSession();
    const u = data.session && data.session.user;
    if (!u) return null;
    return { nombre: (u.user_metadata && u.user_metadata.nombre) || u.email.split('@')[0], email: u.email };
  }
  async login(email, password) {
    const { error } = await this.sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return this.usuario();
  }
  async logout() { await this.sb.auth.signOut(); }
  async cambiarNombre(nombre) {
    const { error } = await this.sb.auth.updateUser({ data: { nombre } });
    if (error) throw error;
  }

  async all(t) {
    let out = [], from = 0;
    const paso = 1000;
    for (;;) {
      const { data, error } = await this.sb.from(t).select('*').range(from, from + paso - 1);
      if (error) throw error;
      out = out.concat(data);
      if (data.length < paso) break;
      from += paso;
    }
    return out;
  }
  async insert(t, row) {
    const { data, error } = await this.sb.from(t).insert({ id: uid(), ...row }).select().single();
    if (error) throw error;
    return data;
  }
  async update(t, id, patch) {
    const { data, error } = await this.sb.from(t).update(patch).eq('id', id).select().single();
    if (error) throw error;
    return data;
  }
  async remove(t, id) {
    const { error } = await this.sb.from(t).delete().eq('id', id);
    if (error) throw error;
  }

  async upload(path, blob, onProgress) {
    const { data } = await this.sb.auth.getSession();
    if (!data.session) throw new Error('Tu sesión expiró. Vuelve a entrar.');
    return new Promise((res, rej) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `${this.url}/storage/v1/object/${BUCKET}/${path}`);
      xhr.setRequestHeader('Authorization', `Bearer ${data.session.access_token}`);
      xhr.setRequestHeader('apikey', this.key);
      xhr.setRequestHeader('x-upsert', 'true');
      xhr.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
      xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        if (xhr.status < 300) return res(path);
        if (xhr.status === 413) return rej(new Error('El archivo es demasiado grande para subirlo.'));
        let msg = '';
        try { msg = JSON.parse(xhr.responseText).message; } catch (e) { /* sin detalle */ }
        rej(new Error(msg || `No se pudo subir el archivo (error ${xhr.status}).`));
      };
      xhr.onerror = () => rej(new Error('Sin conexión a internet al subir el archivo.'));
      xhr.send(blob);
    });
  }
  async fileUrl(path) {
    const { data, error } = await this.sb.storage.from(BUCKET).createSignedUrl(path, 3600);
    if (error) throw error;
    return data.signedUrl;
  }
  async fileBlob(path) {
    const { data, error } = await this.sb.storage.from(BUCKET).download(path);
    if (error) throw error;
    return data;
  }
  async removeFile(path) {
    const { error } = await this.sb.storage.from(BUCKET).remove([path]);
    if (error) throw error;
  }
}

function traducirError(err) {
  const m = (err && (err.message || err.error_description)) || String(err);
  if ((err && err.code === '23505') || /duplicate key/i.test(m)) {
    if (/una_clienta_por_caja/.test(m)) return 'Esa caja ya tiene una clienta asignada.';
    if (/una_caja_por_clienta/.test(m)) return 'Esa clienta ya tiene una caja asignada.';
    return 'Ese registro ya existe.';
  }
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Sin conexión a internet. Revisa la señal e intenta de nuevo.';
  if (/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/JWT|session/i.test(m)) return 'Tu sesión expiró. Cierra y vuelve a entrar.';
  if (/foreign key/i.test(m)) return 'No se puede borrar porque tiene historial asociado.';
  return m;
}

/* ---------- Respaldo en memoria (si el navegador no permite guardar) ---------- */
class MemStore extends LocalStore {
  async init() {
    this.mem = {};
    for (const t of [...TABLAS, 'archivos']) this.mem[t] = new Map();
    for (const c of CATEGORIAS_INICIALES) this.mem.categorias.set(c.id, { ...c });
  }
  _tx(store, modo, fn) {
    const m = this.mem[store];
    const s = {
      getAll: () => ({ result: [...m.values()].map(x => ({ ...x })) }),
      get: id => ({ result: m.has(id) ? { ...m.get(id) } : undefined }),
      add: r => { if (m.has(r.id)) throw new Error('Ese registro ya existe.'); m.set(r.id, { ...r }); return {}; },
      put: r => { m.set(r.id, { ...r }); return {}; },
      delete: id => { m.delete(id); return {}; },
      clear: () => { m.clear(); return {}; },
    };
    try { const r = fn(s); return Promise.resolve(r && 'result' in r ? r.result : undefined); } catch (e) { return Promise.reject(e); }
  }
}

function aFecha(v) {
  if (v instanceof Date) return v;
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
    const [y, m, d] = v.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  return new Date(v);
}

const fechaHora = v => v ? aFecha(v).toLocaleString('es-MX', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
function fechaISO(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function inicioDia(d) { const x = aFecha(d); return new Date(x.getFullYear(), x.getMonth(), x.getDate()); }
function diasDesde(v) { return Math.round((inicioDia(new Date()) - inicioDia(v)) / 864e5); }
const ordenNatural = (a, b) => String(a).localeCompare(String(b), 'es', { numeric: true, sensitivity: 'base' });
const sinAcentos = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function direccion(c) {

  const l3 = [c.ciudad, c.estado].filter(Boolean).join(', ');
  return [l1, l2, l3].filter(Boolean).join(', ');
}

/* ---------- Avisos y modales ---------- */
function toast(msg, tipo = 'ok') {
  const t = document.createElement('div');
  t.className = `toast toast-${tipo}`;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('visible'));
  setTimeout(() => { t.classList.remove('visible'); setTimeout(() => t.remove(), 300); }, tipo === 'error' ? 5000 : 2800);
}

function modal({ titulo, html, botones = [{ texto: 'Cerrar', valor: null }], cerrable = true, alAbrir }) {
  return new Promise(resolve => {
    const fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        ${titulo ? `<h2 class="modal-titulo">${esc(titulo)}</h2>` : ''}
        <div class="modal-cuerpo">${html || ''}</div>
        <div class="modal-botones">
          ${botones.map((b, i) => `<button type="button" class="btn ${b.clase || (i === botones.length - 1 ? 'btn-primario' : 'btn-secundario')}" data-i="${i}">${esc(b.texto)}</button>`).join('')}
        </div>
      </div>`;
    const cerrar = v => { fondo.classList.remove('visible'); setTimeout(() => fondo.remove(), 200); resolve(v); };
    fondo.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b) {
        const def = botones[+b.dataset.i];
        if (def.antes && def.antes(fondo) === false) return;
        cerrar(typeof def.valor === 'function' ? def.valor(fondo) : def.valor);
      } else if (cerrable && e.target === fondo) cerrar(null);
    });
    document.body.appendChild(fondo);
    requestAnimationFrame(() => fondo.classList.add('visible'));
    alAbrir && alAbrir(fondo, cerrar);
  });
}

function confirmar(msg, { titulo = '¿Confirmas?', si = 'Sí, continuar', no = 'Cancelar', peligro = false } = {}) {
  return modal({
    titulo, html: `<p>${msg}</p>`,
    botones: [{ texto: no, valor: false }, { texto: si, valor: true, clase: peligro ? 'btn-peligro' : 'btn-primario' }],
  }).then(Boolean);
}

/* ---------- Archivos ---------- */
function compartirArchivos(archivos) {
  // archivos: [{ blob, nombre }]. En iPhone abre el menú Compartir (Guardar en Archivos, WhatsApp, correo...).
  if (window.claude && window.claude.use) return guardarEnVisor(archivos);
  const files = archivos.map(a => new File([a.blob], a.nombre, { type: a.blob.type }));
  if (esTactil() && navigator.canShare && navigator.canShare({ files })) {
    return navigator.share({ files }).catch(e => { if (e.name !== 'AbortError') descargar(archivos); });
  }
  descargar(archivos);
  return Promise.resolve();
}
async function guardarEnVisor(archivos) {
  const dl = await window.claude.use('downloads').catch(() => null);
  if (!dl) { toast('Aquí no se pueden descargar archivos. En la app instalada sí.', 'error'); return; }
  for (const a of archivos) {
    try { await dl.save({ filename: a.nombre, data: a.blob }); }
    catch (e) { if (e && e.code !== 'declined') { toast('No se pudo descargar el archivo.', 'error'); return; } }
  }
}
function descargar(archivos) {
  archivos.forEach((a, i) => setTimeout(() => {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(a.blob);
    link.download = a.nombre;
    document.body.appendChild(link);
    link.click();
    setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 5000);
  }, i * 400));
}
function dataUrlABlob(url) {
  const [meta, b64] = url.split(',');
  const tipo = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: tipo });
}

/* Reduce una foto a máx. 1600 px en JPEG para que suba rápido. */
async function reducirFoto(file, maxLado = 1600, calidad = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('No se pudo leer la foto.'));
      i.src = url;
    });
    const k = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k);
    c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', calidad));
  } finally { URL.revokeObjectURL(url); }
}

const mb = bytes => (bytes / 1048576).toFixed(1);

/* ---------- Códigos postales (catálogo SEPOMEX incluido en la app) ---------- */
const cacheCP = {};
async function buscarCP(cp) {
  cp = String(cp || '').trim();
  if (!/^\d{5}$/.test(cp)) return null;
  const pre = cp.slice(0, 2);
  if (!cacheCP[pre]) {
    try {
      const r = await fetch(`cp/${pre}.json`);
      cacheCP[pre] = r.ok ? await r.json() : {};
    } catch (e) { return null; }
  }
  const f = cacheCP[pre][cp];
  return f ? { estado: f[0], municipio: f[1], ciudad: f[2], colonias: f[3] } : null;
}

/* ---------- QR ---------- */
function urlBase() { return location.href.split('#')[0].split('?')[0]; }
function textoQR(codigo) { return `${urlBase()}#/caja/${encodeURIComponent(codigo)}`; }
function qrModulos(texto) {
  const qr = qrcode(0, 'M');
  qr.addData(texto);
  qr.make();
  return qr;
}
function qrSVG(texto, tam = 160) {
  const qr = qrModulos(texto);
  const n = qr.getModuleCount(), m = 2, total = n + m * 2;
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) d += `M${x + m},${y + m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${tam}" height="${tam}" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function dibujarQR(ctx, texto, x, y, tam) {
  const qr = qrModulos(texto);
  const n = qr.getModuleCount(), m = 2, celda = tam / (n + m * 2);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, tam, tam);
  ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (qr.isDark(r, c)) ctx.fillRect(Math.floor(x + (c + m) * celda), Math.floor(y + (r + m) * celda), Math.ceil(celda), Math.ceil(celda));
  }
}
/* Extrae el código de caja del contenido de un QR (URL de la app o texto "CAJA:A1"). */
function codigoDesdeQR(texto) {
  if (!texto) return null;
  let m = String(texto).match(/#\/caja\/([^/?#]+)/);
  if (m) return decodeURIComponent(m[1]).toUpperCase();
  m = String(texto).match(/^CAJA:(.+)$/i);
  if (m) return m[1].trim().toUpperCase();
  const t = String(texto).trim().toUpperCase();
  return /^[A-Z0-9-]{1,12}$/.test(t) ? t : null;
}

/* ---------- Lector de QR ---------- */
function escanearQR() {
  return new Promise(resolve => {
    const capa = document.createElement('div');
    capa.className = 'escaner';
    capa.innerHTML = `
      <video playsinline muted autoplay></video>

      <div class="escaner-abajo">
        <p class="escaner-msg">Apunta la cámara al código QR de la caja</p>
        <div class="escaner-acciones">
          <label class="btn btn-claro">Leer desde foto<input type="file" accept="image/*" hidden data-foto></label>
          <button type="button" class="btn btn-claro" data-manual>Escribir código</button>
        </div>
      </div>`;
    document.body.appendChild(capa);
    const video = $('video', capa);
    const lienzo = document.createElement('canvas');
    const ctx = lienzo.getContext('2d', { willReadFrequently: true });
    let stream = null, activo = true;

    const terminar = codigo => {
      activo = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      capa.remove();
      resolve(codigo);
    };
    const encontrado = texto => {
      const c = codigoDesdeQR(texto);
      if (!c) { $('.escaner-msg', capa).textContent = 'Ese QR no es de una caja. Intenta con otro.'; return false; }
      if (navigator.vibrate) navigator.vibrate(80);
      terminar(c);
      return true;
    };

    $('[data-cerrar]', capa).onclick = () => terminar(null);
    $('[data-manual]', capa).onclick = async () => {
      const c = await modal({
        titulo: 'Escribir código de caja',
        html: '<label>Código de la caja<input id="codigo-manual" placeholder="Ej. A1" autocapitalize="characters" autocomplete="off"></label>',
        botones: [{ texto: 'Cancelar', valor: null }, { texto: 'Abrir caja', valor: el => $('#codigo-manual', el).value }],
        alAbrir: (el, cerrar) => {
          const i = $('#codigo-manual', el);
          setTimeout(() => i.focus(), 50);
          i.onkeydown = e => { if (e.key === 'Enter') cerrar(i.value); };
        },
      });
      if (c && c.trim()) terminar(c.trim().toUpperCase());
    };
    $('[data-foto]', capa).onchange = async e => {
      const f = e.target.files[0];
      if (!f) return;
      const img = new Image();
      img.src = URL.createObjectURL(f);
      await img.decode().catch(() => {});
      const k = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
      lienzo.width = img.naturalWidth * k; lienzo.height = img.naturalHeight * k;
      ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
      const r = jsQR(ctx.getImageData(0, 0, lienzo.width, lienzo.height).data, lienzo.width, lienzo.height);
      URL.revokeObjectURL(img.src);
      if (!r || !encontrado(r.data)) $('.escaner-msg', capa).textContent = 'No se encontró un QR en la foto.';
    };

    const leer = () => {
      if (!activo) return;
      if (video.readyState >= 2 && video.videoWidth) {
        const k = Math.min(1, 720 / Math.max(video.videoWidth, video.videoHeight));
        lienzo.width = Math.round(video.videoWidth * k);
        lienzo.height = Math.round(video.videoHeight * k);
        ctx.drawImage(video, 0, 0, lienzo.width, lienzo.height);
        const r = jsQR(ctx.getImageData(0, 0, lienzo.width, lienzo.height).data, lienzo.width, lienzo.height, { inversionAttempts: 'dontInvert' });
        if (r && r.data && encontrado(r.data)) return;
      }
      setTimeout(() => requestAnimationFrame(leer), 120);
    };

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('.escaner-msg', capa).textContent = 'Este navegador no permite usar la cámara aquí. Usa "Leer desde foto".';
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
      .then(s => {
        if (!activo) { s.getTracks().forEach(t => t.stop()); return; }
        stream = s;
        video.srcObject = s;
        video.play().catch(() => {});
        leer();
      })
      .catch(() => {
        $('.escaner-msg', capa).textContent = 'No se pudo abrir la cámara. Revisa el permiso en Ajustes > Safari > Cámara, o usa "Leer desde foto".';
      });
  });
}

/* ---------- Compresión de video ----------
 * Reproduce el video en un lienzo más pequeño y lo vuelve a grabar con menor calidad.
 * Tarda aproximadamente lo mismo que dura el video. Se debe llamar directamente desde
 * un toque del usuario (sin "await" antes) para que el iPhone permita conservar el audio.
 */
function puedeComprimir() {
  return !!(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream);
}
function formatoGrabacion() {
  const opciones = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return opciones.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
}
const PERFILES_VIDEO = {
  subida: { maxLado: 1280, bps: 2500000 },   // ~19 MB por minuto
  archivo: { maxLado: 854, bps: 900000 },    // ~7 MB por minuto (pedido ya enviado)
};

/* fuente: Blob o URL. opciones: { maxBytes, actx (AudioContext compartido), turno (promesa a esperar antes de grabar) } */
function comprimirVideo(fuente, perfil, onProgress, opciones = {}) {
  const { maxLado, bps: bpsPerfil } = PERFILES_VIDEO[perfil] || PERFILES_VIDEO.archivo;
  if (!puedeComprimir()) return Promise.reject(new Error('Este navegador no puede comprimir videos.'));

  // Todo lo que requiere el "toque" del usuario se hace aquí, de forma síncrona.
  const esBlob = typeof fuente !== 'string';
  const url = esBlob ? URL.createObjectURL(fuente) : fuente;
  const v = document.createElement('video');
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.preload = 'auto';
  if (!esBlob) v.crossOrigin = 'anonymous';
  v.src = url;
  const propio = !opciones.actx;
  let actx = opciones.actx || null, destinoAudio = null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(v);
    destinoAudio = actx.createMediaStreamDestination();
    src.connect(destinoAudio);
    actx.resume();
  } catch (e) { destinoAudio = null; v.muted = true; }
  const arranque = v.play().catch(() => { v.muted = true; return v.play(); });

  return (async () => {
    const lienzo = document.createElement('canvas');
    let activo = true, rec = null, pista = null;
    const alVolver = () => { if (document.visibilityState === 'visible' && activo && v.paused && !v.ended) v.play().catch(() => {}); };
    try {
      await arranque;
      v.pause();
      if (!v.videoWidth) await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error('No se pudo leer el video.')); });
      if (opciones.turno) await opciones.turno;
      let bps = bpsPerfil;
      if (opciones.maxBytes && isFinite(v.duration) && v.duration > 0) {
        bps = Math.max(300000, Math.min(bps, (opciones.maxBytes * 8 * 0.85) / v.duration - 64000));
      }
      const k = Math.min(1, maxLado / Math.max(v.videoWidth, v.videoHeight));
      lienzo.width = Math.round((v.videoWidth * k) / 2) * 2;
      lienzo.height = Math.round((v.videoHeight * k) / 2) * 2;
      const ctx = lienzo.getContext('2d');
      const stream = lienzo.captureStream(30);
      pista = stream;
      if (destinoAudio && !v.muted) destinoAudio.stream.getAudioTracks().forEach(t => stream.addTrack(t));
      const tipo = formatoGrabacion();
      rec = new MediaRecorder(stream, { ...(tipo ? { mimeType: tipo } : {}), videoBitsPerSecond: bps, audioBitsPerSecond: 64000 });
      const partes = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); };
      const detenido = new Promise(res => { rec.onstop = res; });

      const dibujar = () => {
        if (!activo) return;
        ctx.drawImage(v, 0, 0, lienzo.width, lienzo.height);
        if (onProgress && v.duration) onProgress(Math.min(1, v.currentTime / v.duration));
        if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(dibujar);
        else requestAnimationFrame(dibujar);
      };
      document.addEventListener('visibilitychange', alVolver);
      v.currentTime = 0;
      ctx.drawImage(v, 0, 0, lienzo.width, lienzo.height);
      rec.start(1000);
      await v.play();
      dibujar();
      await new Promise((res, rej) => { v.onended = res; v.onerror = () => rej(new Error('Error al reproducir el video.')); });
      activo = false;
      ctx.drawImage(v, 0, 0, lienzo.width, lienzo.height);
      rec.stop();
      await detenido;
      const salida = new Blob(partes, { type: (rec.mimeType || tipo || 'video/mp4').split(';')[0] });
      if (!salida.size) throw new Error('La compresión no produjo video.');
      return salida;
    } finally {
      activo = false;
      document.removeEventListener('visibilitychange', alVolver);
      try { if (rec && rec.state !== 'inactive') rec.stop(); } catch (e) { /* ya detenido */ }
      if (pista) pista.getTracks().forEach(t => t.stop());
      v.pause();
      v.removeAttribute('src');
      if (esBlob) URL.revokeObjectURL(url);
      if (actx && propio) actx.close().catch(() => {});
    }
  })();
}
function extensionVideo(blob) {
  const t = blob.type || '';
  if (t.includes('webm')) return 'webm';
  if (t.includes('quicktime')) return 'mov';
  return 'mp4';
}

/* ---------- Datos ---------- */
async function refrescar(forzar = false) {
  if (!forzar && Date.now() - D.cargado < 4000) return;
  const res = await Promise.all(TABLAS.map(t => store.all(t)));
  TABLAS.forEach((t, i) => { D[t] = res[i]; });
  D.cargado = Date.now();
}
const idx = {
  caja: id => D.cajas.find(c => c.id === id),
  clienta: id => D.clientas.find(c => c.id === id),
  asig: id => D.asignaciones.find(a => a.id === id),
  activaCaja: id => D.asignaciones.find(a => a.caja === id && a.estado === 'activa'),
  activaClienta: id => D.asignaciones.find(a => a.clienta_id === id && a.estado === 'activa'),
  pedidosDe: asigId => D.pedidos.filter(p => p.asignacion_id === asigId).sort((a, b) => (a.fecha < b.fecha ? -1 : 1)),
  categorias: (todas = false) => D.categorias.filter(c => todas || c.activa !== false).sort((a, b) => (a.orden || 0) - (b.orden || 0)),
};
function estadoAsig(a) {
  const dias = diasDesde(a.asignada_en);
  return { dias, nivel: dias >= CFG.diasAlerta ? 'vencida' : dias >= CFG.diasAviso ? 'aviso' : 'ok' };
}
function resumenPedidos(pedidos) {
  return pedidos.reduce((r, p) => ({ total: r.total + Number(p.total || 0), prendas: r.prendas + Number(p.prendas || 0) }), { total: 0, prendas: 0 });
}
function textoItems(items) {
  const g = {};
  for (const it of items || []) {
    g[it.nombre] = g[it.nombre] || { cant: 0, importe: 0 };
    g[it.nombre].cant += it.cantidad;
    g[it.nombre].importe += it.precio * it.cantidad;
  }
  return Object.entries(g).map(([n, v]) => `${v.cant} ${n}`).join(' · ');
}
function cajasOrdenadas() { return D.cajas.slice().sort((a, b) => ordenNatural(a.id, b.id)); }
function vencidas() {
  return D.asignaciones.filter(a => a.estado === 'activa').map(a => ({ a, ...estadoAsig(a) })).filter(x => x.nivel === 'vencida').sort((x, y) => y.dias - x.dias);
}

async function accion(fn, texto = 'Guardando…') {

/* Reglas: una clienta por caja y una caja por clienta. */
async function asignarCaja(cajaId, clientaId) {
  await refrescar(true);
  if (idx.activaCaja(cajaId)) throw new Error(`La caja ${cajaId} ya tiene una clienta asignada.`);
  const otra = idx.activaClienta(clientaId);
  if (otra) throw new Error(`Esa clienta ya está en la caja ${otra.caja}. Usa "Reasignar" desde esa caja.`);

    caja: cajaId, clienta_id: clientaId, estado: 'activa', asignada_en: new Date().toISOString(), asignada_por: usuario.nombre, movimientos: [],

  D.asignaciones.push(a);
  return a;
}

    </header>
    ${CFG.vistaPrevia ? '<div class="aviso-demo">Vista previa con datos de ejemplo. Lo que hagas aquí se queda solo en este navegador.</div>' : store.modo !== 'nube' ? '<div class="aviso-demo">Modo prueba: los datos solo se guardan en este dispositivo.</div>' : ''}
    <main id="vista"></main>
    <nav class="tabs">
      <a href="#/cajas" data-tab="cajas">${IC.cajas}<span>Cajas</span></a>
      <a href="#/clientas" data-tab="clientas">${IC.clientas}<span>Clientas</span></a>
      <a href="#" data-tab="escanear" class="tab-escanear" id="tab-escanear"><b>${IC.escanear}</b><span>Escanear</span></a>
      <a href="#/pedido" data-tab="pedido">${IC.pedido}<span>Pedido nuevo</span></a>
      <a href="#/reportes" data-tab="reportes">${IC.reportes}<span>Reportes</span></a>
    </nav>`;
  $('#tab-escanear').onclick = async e => {
    e.preventDefault();
    const c = await escanearQR();

}
function titulo(t, atras) {
  const conLogo = t === CFG.nombreNegocio;
  $('#logo-barra').hidden = !conLogo;
  $('#titulo').textContent = conLogo ? '' : t;
  const b = $('#btn-atras');
  b.hidden = !atras;
  if (atras) b.href = `#/${atras}`;
  document.title = `${t} · ${CFG.nombreNegocio}`;
}
const vista = () => $('#vista');
let rutaInterna = '';
const ir = r => {
  if (CFG.vistaPrevia) { rutaInterna = r; navegar(); return; }
  if (location.hash === `#/${r}`) navegar(); else location.hash = `#/${r}`;
};
const rutaActual = () => (CFG.vistaPrevia ? rutaInterna : location.hash.replace(/^#\/?/, ''));

const RUTAS = [
  [/^(cajas)?$/, vistaCajas, 'cajas', true],
  [/^caja\/([^/]+)$/, vistaCaja, 'cajas', true],
  [/^clientas$/, vistaClientas, 'clientas', true],
  [/^clienta\/nueva$/, q => formClienta(null, q), 'clientas', false],
  [/^clienta\/([^/]+)\/editar$/, formClienta, 'clientas', false],
  [/^clienta\/([^/]+)$/, vistaClienta, 'clientas', true],
  [/^pedido$/, elegirCajaPedido, 'pedido', true],
  [/^pedido\/([^/]+)$/, formPedido, 'pedido', false],
  [/^enviar\/([^/]+)$/, formEnvio, 'cajas', false],
  [/^reasignar\/([^/]+)$/, vistaReasignar, 'cajas', true],
  [/^reportes$/, vistaReportes, 'reportes', true],
  [/^ajustes$/, vistaAjustes, '', true],
  [/^ajustes\/cajas$/, vistaAdminCajas, '', true],
];
let rutaRecargable = false;
let turnoRender = 0;
async function navegar() {
  if (!usuario) return;
  const [path, qs] = rutaActual().split('?');
  const query = new URLSearchParams(qs || '');
  const ruta = RUTAS.find(r => r[0].test(path));
  if (!ruta) { ir('cajas'); return; }
  const [re, fn, tab, recargable] = ruta;
  const args = path.match(re).slice(1).filter(x => x !== undefined && x !== 'cajas').map(decodeURIComponent);
  $$('.tabs a').forEach(a => a.classList.toggle('activa', a.dataset.tab === tab));
  rutaRecargable = recargable;
  const turno = ++turnoRender;
  const timer = setTimeout(() => { if (turno === turnoRender) vista().innerHTML = '<div class="cargando"><div class="spinner"></div></div>'; }, 250);
  try {
    await refrescar();
    clearTimeout(timer);
    if (turno !== turnoRender) return;
    await fn(...args, query);
  } catch (e) {
    clearTimeout(timer);
    console.error(e);
    vista().innerHTML = `<div class="vacio">${IC.alerta}<p>${esc(traducirError(e))}</p><button class="btn btn-primario" onclick="D.cargado=0;navegar()">Reintentar</button></div>`;
  }
  window.scrollTo(0, 0);
}

/* ---------- Alertas de 20 días ---------- */

  const v = vencidas();
  if (navigator.setAppBadge) (v.length ? navigator.setAppBadge(v.length) : navigator.clearAppBadge()).catch(() => {});

/* ---------- Pantalla: Cajas ---------- */
function vistaCajas(query) {
  titulo(CFG.nombreNegocio);
  const filtro = query.get('f') || 'todas';
  const filas = cajasOrdenadas().map(c => {
    const a = idx.activaCaja(c.id);
    const cl = a && idx.clienta(a.clienta_id);
    const st = a ? estadoAsig(a) : null;
    const r = a ? resumenPedidos(idx.pedidosDe(a.id)) : null;
    return { c, a, cl, st, r };
  });
  const cuenta = {
    todas: filas.length,
    ocupadas: filas.filter(f => f.a).length,
    libres: filas.filter(f => !f.a).length,
    vencidas: filas.filter(f => f.st && f.st.nivel === 'vencida').length,
  };
  if (!filas.length) {
    vista().innerHTML = `<div class="vacio">${IC.cajas}<h2>Aún no hay cajas</h2><p>Crea tus cajas (A1, A2, B1…) y genera sus códigos QR.</p><a class="btn btn-primario" href="#/ajustes/cajas">Crear cajas</a></div>`;
    return;
  }
  const visibles = filas.filter(f => filtro === 'todas' || (filtro === 'ocupadas' && f.a) || (filtro === 'libres' && !f.a) || (filtro === 'vencidas' && f.st && f.st.nivel === 'vencida'));
  const aviso = cuenta.vencidas ? `<a class="banner banner-vencida" href="#/cajas?f=vencidas">${IC.alerta}<span><b>${cuenta.vencidas} ${cuenta.vencidas === 1 ? 'caja pasa' : 'cajas pasan'} de ${CFG.diasAlerta} días.</b> Esa mercancía debe enviarse.</span></a>` : '';
  vista().innerHTML = `
    ${aviso}
    <div class="filtros">
      ${[['todas', 'Todas'], ['ocupadas', 'Ocupadas'], ['libres', 'Libres'], ['vencidas', 'Vencidas']].map(([k, t]) => `<a href="#/cajas?f=${k}" class="filtro ${filtro === k ? 'activo' : ''}">${t} <b>${cuenta[k]}</b></a>`).join('')}
    </div>
    <input type="search" class="buscador" id="buscar" placeholder="Buscar caja o clienta…" autocomplete="off">
    <div class="rejilla" id="rejilla">
      ${visibles.map(f => `
        <a class="caja-card nivel-${f.st ? f.st.nivel : 'libre'}" href="#/caja/${encodeURIComponent(f.c.id)}" data-busca="${esc(sinAcentos(`${f.c.id} ${nombreCompleto(f.cl)}`))}">
          <span class="caja-codigo">${esc(f.c.id)}</span>
          ${f.a ? `<span class="caja-nombre">${esc(nombreCompleto(f.cl))}</span>
            <span class="caja-meta">Día ${f.st.dias} · ${dinero(f.r.total)}</span>` : '<span class="caja-nombre libre">Libre</span>'}
        </a>`).join('') || '<p class="nota">No hay cajas en este filtro.</p>'}
    </div>`;
  $('#buscar').oninput = e => {
    const q = sinAcentos(e.target.value);
    $$('#rejilla .caja-card').forEach(el => { el.hidden = q && !el.dataset.busca.includes(q); });
  };
}

/* ---------- Pantalla: una caja ---------- */
async function vistaCaja(id) {
  id = id.toUpperCase();
  const caja = idx.caja(id);
  titulo(`Caja ${id}`, 'cajas');
  if (!caja) {
    vista().innerHTML = `<div class="vacio">${IC.alerta}<h2>La caja ${esc(id)} no existe</h2><p>Puedes crearla en Ajustes → Cajas y QR.</p><a class="btn btn-primario" href="#/ajustes/cajas">Ir a Cajas y QR</a></div>`;
    return;
  }
  const a = idx.activaCaja(id);
  if (!a) return vistaCajaLibre(caja);

  const cl = idx.clienta(a.clienta_id);
  const st = estadoAsig(a);
  const pedidos = idx.pedidosDe(a.id);
  const r = resumenPedidos(pedidos);
  const faltan = CFG.diasAlerta - st.dias;
  const estadoTxt = st.nivel === 'vencida' ? `Lleva ${st.dias} días. ¡Debe enviarse!` : st.nivel === 'aviso' ? `Lleva ${st.dias} días. Faltan ${faltan} para el límite.` : `Lleva ${st.dias} ${st.dias === 1 ? 'día' : 'días'}. Faltan ${faltan} para el límite de ${CFG.diasAlerta}.`;
  const historialCaja = D.asignaciones.filter(x => x.caja === id && x.estado === 'enviada').sort((x, y) => (x.enviada_en < y.enviada_en ? 1 : -1));

  vista().innerHTML = `
    <div class="banner banner-${st.nivel}">${st.nivel === 'ok' ? IC.cajas : IC.alerta}<span>${estadoTxt}<br><small>Asignada el ${fechaCorta(a.asignada_en)}${(a.movimientos || []).length ? ` · reasignada desde ${esc(a.movimientos.map(m => m.de).join(', '))}` : ''}</small></span></div>
    ${tarjetaClienta(cl)}
    <div class="totales">
      <div><small>Pedidos</small><b>${pedidos.length}</b></div>
      <div><small>Prendas</small><b>${r.prendas}</b></div>
      <div><small>Total</small><b>${dinero(r.total)}</b></div>
    </div>
    <div class="acciones">
      <a class="btn btn-primario" href="#/pedido/${encodeURIComponent(id)}">${IC.mas} Nuevo pedido</a>
      <a class="btn btn-secundario" href="#/enviar/${encodeURIComponent(id)}">${IC.camion} Marcar como enviado</a>
      <a class="btn btn-secundario" href="#/reasignar/${encodeURIComponent(id)}">${IC.mover} Reasignar a otra caja</a>
    </div>
    <h3 class="seccion">Historial de pedidos</h3>
    ${pedidos.length ? pedidos.slice().reverse().map(p => tarjetaPedido(p, true)).join('') : '<p class="nota">Esta caja todavía no tiene pedidos.</p>'}
    ${historialCaja.length ? `<details class="plegable"><summary>Envíos anteriores de esta caja (${historialCaja.length})</summary>
      ${historialCaja.map(x => `<a class="fila" href="#/clienta/${x.clienta_id}"><span>${esc(nombreCompleto(idx.clienta(x.clienta_id)))}</span><small>Enviada ${fechaCorta(x.enviada_en)}</small></a>`).join('')}</details>` : ''}`;
  conectarPedidos(vista());
}

  return `
    <div class="tarjeta clienta">
      <div class="clienta-cabeza">
        <div><b class="clienta-nombre">${esc(nombreCompleto(cl))}</b><small>${esc(direccion(cl))}</small>

      ${p.notas ? `<p class="nota">${esc(p.notas)}</p>` : ''}

          ${borrable ? `<button class="btn btn-mini btn-icono-solo" data-borrar-pedido="${p.id}" aria-label="Eliminar pedido">${IC.basura}</button>` : ''}

function conectarPedidos(raiz) {
  $$('[data-ver-video]', raiz).forEach(b => { b.onclick = () => verVideo(D.pedidos.find(p => p.id === b.dataset.verVideo)); });
  $$('[data-borrar-pedido]', raiz).forEach(b => {
    b.onclick = async () => {
      const p = D.pedidos.find(x => x.id === b.dataset.borrarPedido);
      if (!(await confirmar(`Se eliminará el pedido del ${fechaHora(p.fecha)} por ${dinero(p.total)}, con su video. Esto no se puede deshacer.`, { titulo: '¿Eliminar pedido?', si: 'Eliminar', peligro: true }))) return;
      await accion(async () => {
        await store.remove('pedidos', p.id);
        if (p.video) await store.removeFile(p.video).catch(() => {});
        D.pedidos = D.pedidos.filter(x => x.id !== p.id);
        toast('Pedido eliminado');
        navegar();
      }, 'Eliminando…');
    };
  });
}
async function verVideo(p) {
  const url = await accion(() => store.fileUrl(p.video), 'Abriendo video…');
  if (!url) return;
  modal({ titulo: `Video del ${fechaCorta(p.fecha)}`, html: `<video class="video-modal" src="${esc(url)}" controls playsinline autoplay></video>` });

/* ---------- Pantalla: reasignar ---------- */
function vistaReasignar(id) {
  id = id.toUpperCase();
  titulo(`Reasignar ${id}`, `caja/${encodeURIComponent(id)}`);
  const a = idx.activaCaja(id);
  if (!a) { ir(`caja/${encodeURIComponent(id)}`); return; }
  const cl = idx.clienta(a.clienta_id);
  const libres = cajasOrdenadas().filter(c => !idx.activaCaja(c.id));
  vista().innerHTML = `
    <p class="intro">Mover a <b>${esc(nombreCompleto(cl))}</b> y sus ${idx.pedidosDe(a.id).length} pedidos de la caja <b>${esc(id)}</b> a otra caja libre. El conteo de días continúa desde ${fechaCorta(a.asignada_en)}.</p>
    <div class="acciones"><button class="btn btn-secundario" id="escanear-destino">${IC.escanear} Escanear la caja nueva</button></div>
    <h3 class="seccion">Cajas libres</h3>
    <div class="rejilla">${libres.map(c => `<button class="caja-card nivel-libre" data-destino="${esc(c.id)}"><span class="caja-codigo">${esc(c.id)}</span><span class="caja-nombre libre">Libre</span></button>`).join('') || '<p class="nota">No hay cajas libres. Crea más en Ajustes → Cajas y QR.</p>'}</div>`;
  const mover = async destino => {
    destino = destino.toUpperCase();
    if (destino === id) { toast('Es la misma caja.', 'error'); return; }
    if (!idx.caja(destino)) { toast(`La caja ${destino} no existe.`, 'error'); return; }
    if (!(await confirmar(`¿Mover a ${esc(nombreCompleto(cl))} de la caja <b>${esc(id)}</b> a la caja <b>${esc(destino)}</b>?<br><br>La caja ${esc(id)} quedará libre.`, { titulo: 'Reasignar caja', si: 'Mover' }))) return;
    const ok = await accion(async () => {
      await refrescar(true);
      const actual = idx.asig(a.id);
      if (!actual || actual.estado !== 'activa' || actual.caja !== id) throw new Error('La caja cambió mientras tanto. Revisa de nuevo.');
      if (idx.activaCaja(destino)) throw new Error(`La caja ${destino} ya está ocupada.`);
      const movimientos = [...(actual.movimientos || []), { de: id, a: destino, fecha: new Date().toISOString(), por: usuario.nombre }];
      await store.update('asignaciones', a.id, { caja: destino, movimientos });
      D.cargado = 0;
      return true;
    }, 'Moviendo…');
    if (ok) { toast(`Movida a la caja ${destino}. La caja ${id} quedó libre.`); ir(`caja/${encodeURIComponent(destino)}`); }
  };
  $$('[data-destino]').forEach(b => { b.onclick = () => mover(b.dataset.destino); });
  $('#escanear-destino').onclick = async () => { const c = await escanearQR(); if (c) mover(c); };
}

      await refrescar(true);
      const actual = idx.asig(a.id);
      if (!actual || actual.estado !== 'activa') throw new Error('Esta caja ya fue enviada o cambió. Revisa de nuevo.');
      espera.mostrar('Subiendo foto…', 0);
      const reducida = await reducirFoto(foto);
      const ruta = `guias/${a.id}.jpg`;
      await store.upload(ruta, reducida, p => espera.mostrar('Subiendo foto…', p));
      espera.mostrar('Guardando…');
      await store.update('asignaciones', a.id, {
        estado: 'enviada', enviada_en: new Date().toISOString(), enviada_por: usuario.nombre, foto_guia: ruta,
        paqueteria: f.paqueteria, guia: f.guia.trim(), peso_kg: f.peso_kg ? Number(f.peso_kg) : null, medidas: f.medidas.trim(),
        costo_envio: f.costo_envio ? Number(f.costo_envio) : null, notas_envio: f.notas_envio.trim(),
      });
      D.cargado = 0;
      return true;
    }, 'Guardando envío…');
    if (!ok) return;
    toast(`Envío registrado. La caja ${id} quedó libre.`);
    ir(`clienta/${cl.id}`);
    const pendientes = pedidos.filter(p => p.video && !p.video_comprimido);
    if (pendientes.length) setTimeout(() => ofrecerCompresion(pendientes), 600);
  };
}

/* Comprime los videos de pedidos ya enviados para ahorrar espacio (sin borrarlos). */
async function ofrecerCompresion(pedidos) {
  if (!puedeComprimir()) return;
  const fuentes = await accion(() => Promise.all(pedidos.map(p => store.fileUrl(p.video))), 'Preparando videos…');
  if (!fuentes) return;
  const resp = await modal({
    titulo: 'Comprimir videos',
    html: `<p>${pedidos.length === 1 ? 'Hay 1 video' : `Hay ${pedidos.length} videos`} de pedidos enviados. Comprimirlos ahorra espacio y <b>no se borran</b> (por si hay reclamos).</p><p class="nota">Tarda aproximadamente lo que duran los videos. Deja la app abierta y la pantalla encendida.</p>`,
    botones: [
      { texto: 'Después', valor: null },
      { texto: 'Comprimir ahora', valor: () => iniciarCompresion(pedidos, fuentes) },
    ],
  });
  if (resp) await resp;
}
function iniciarCompresion(pedidos, fuentes) {
  // Se llama directo desde el toque del botón: prepara todos los videos al mismo tiempo
  // (para conservar el audio en iPhone) y los procesa uno por uno.
  let actx = null;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) { actx = null; }
  let turno = Promise.resolve();
  let hechos = 0;
  const trabajos = pedidos.map((p, i) => {
    let liberar;
    const miTurno = turno;
    turno = new Promise(r => { liberar = r; });
    const prog = x => espera.mostrar(`Comprimiendo video ${i + 1} de ${pedidos.length}…`, x);
    const tarea = comprimirVideo(fuentes[i], 'archivo', prog, { actx, turno: miTurno.then(() => prog(0)) })
      .then(async blob => {
        const original = p.video_mb ? p.video_mb * 1048576 : Infinity;
        if (blob.size >= original) { await store.update('pedidos', p.id, { video_comprimido: true }); return; }
        const ruta = `videos/${p.id}-c.${extensionVideo(blob)}`;
        espera.mostrar(`Guardando video ${i + 1} de ${pedidos.length}…`, 0);
        await store.upload(ruta, blob, x => espera.mostrar(`Guardando video ${i + 1} de ${pedidos.length}…`, x));
        await store.update('pedidos', p.id, { video: ruta, video_mb: Number(mb(blob.size)), video_comprimido: true });
        if (ruta !== p.video) await store.removeFile(p.video).catch(() => {});
        hechos++;
      })
      .catch(e => { console.error(e); toast(`Video ${i + 1}: ${traducirError(e)}`, 'error'); })
      .finally(() => liberar());
    return tarea;
  });
  espera.mostrar('Preparando videos…');
  espera.nota('No cierres la app ni apagues la pantalla.');
  return Promise.all(trabajos).then(() => {
    espera.ocultar();
    if (actx) actx.close().catch(() => {});
    D.cargado = 0;
    if (hechos) toast(`${hechos} ${hechos === 1 ? 'video comprimido' : 'videos comprimidos'}`);
    if (rutaRecargable) navegar();
  });
}

      <label>Colonia *
        <select name="colonia_sel" id="colonia-sel"><option value="">Primero escribe el código postal</option></select>
        <input name="colonia" id="colonia-txt" value="${esc(c.colonia || '')}" placeholder="Escribe la colonia" hidden>

        ${campo('ciudad', 'Ciudad / municipio *', 'required')}
        ${campo('estado', 'Estado *', 'required')}
      </div>
      <label>Referencia de la vivienda<textarea name="referencia" rows="2" placeholder="Ej. casa azul con portón negro, frente a la tienda">${esc(c.referencia || '')}</textarea></label>
      <button class="btn btn-primario btn-grande" type="submit">${editar ? 'Guardar cambios' : (cajaDestino ? `Guardar y asignar caja ${esc(cajaDestino)}` : 'Registrar clienta')}</button>
    </form>`;
  const form = $('#f-clienta');
  const sel = $('#colonia-sel'), txt = $('#colonia-txt');
  const usarTexto = v => { sel.hidden = true; txt.hidden = false; if (v != null) txt.value = v; };
  const llenarColonias = async (cp, inicial) => {
    const info = $('#cp-info');
    if (!/^\d{5}$/.test(cp)) { info.textContent = ''; return; }
    info.textContent = 'Buscando…';
    const r = await buscarCP(cp);
    if (!r) { info.textContent = 'No encontramos ese código postal. Escribe la colonia a mano.'; usarTexto(inicial ? undefined : ''); return; }
    info.textContent = `${r.colonias.length} ${r.colonias.length === 1 ? 'colonia' : 'colonias'} · ${r.municipio}, ${r.estado}`;
    sel.hidden = false; txt.hidden = true;
    const actual = inicial ? c.colonia : '';
    const opciones = r.colonias.map(n => `<option ${n === actual ? 'selected' : ''}>${esc(n)}</option>`).join('');
    sel.innerHTML = `<option value="">Selecciona la colonia…</option>${opciones}<option value="__otra">Otra (escribir)</option>`;
    if (actual && !r.colonias.includes(actual)) { sel.value = '__otra'; usarTexto(actual); sel.hidden = false; }
    else if (r.colonias.length === 1 && !inicial) sel.value = r.colonias[0];
    if (!inicial || !form.ciudad.value) form.ciudad.value = r.ciudad;
    if (!inicial || !form.estado.value) form.estado.value = r.estado;
  };
  sel.onchange = () => { if (sel.value === '__otra') { txt.hidden = false; txt.value = ''; txt.focus(); } else txt.hidden = true; };
  form.cp.oninput = () => { form.cp.value = form.cp.value.replace(/\D/g, '').slice(0, 5); if (form.cp.value.length === 5) llenarColonias(form.cp.value, false); };
  if (c.cp) llenarColonias(c.cp, true);

  form.onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    const colonia = (sel.hidden || sel.value === '__otra') ? txt.value.trim() : sel.value;
    const datos = {
      nombre: f.nombre.trim(), apellidos: f.apellidos.trim(), fecha_registro: f.fecha_registro || fechaISO(),
      telefono: telLimpio(f.telefono), correo: f.correo.trim().toLowerCase(),
      calle: f.calle.trim(), numero: f.numero.trim(), interior: f.interior.trim(), cp: f.cp.trim(), colonia,
      ciudad: f.ciudad.trim(), estado: f.estado.trim(), referencia: f.referencia.trim(),
    };
    const faltan = [];
    if (!datos.nombre) faltan.push('nombre');
    if (!datos.apellidos) faltan.push('apellidos');
    if (datos.telefono.length !== 10) faltan.push('teléfono a 10 dígitos');
    if (datos.correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(datos.correo)) faltan.push('correo válido');
    if (!datos.calle) faltan.push('calle');
    if (!datos.numero) faltan.push('número');
    if (!/^\d{5}$/.test(datos.cp)) faltan.push('código postal');
    if (!datos.colonia) faltan.push('colonia');
    if (!datos.ciudad) faltan.push('ciudad');
    if (!datos.estado) faltan.push('estado');
    if (faltan.length) { toast(`Falta: ${faltan.join(', ')}.`, 'error'); return; }
    const repetida = D.clientas.find(x => x.telefono === datos.telefono && (!editar || x.id !== editar.id));
    if (repetida && !(await confirmar(`Ya existe <b>${esc(nombreCompleto(repetida))}</b> con el teléfono ${esc(datos.telefono)}. ¿Guardar de todos modos?`, { titulo: 'Teléfono repetido', si: 'Guardar' }))) return;

    if (editar) {
      const ok = await accion(async () => { await store.update('clientas', editar.id, datos); D.cargado = 0; return true; });
      if (ok) { toast('Datos actualizados'); ir(`clienta/${editar.id}`); }
      return;
    }
    const nueva = await accion(async () => {
      const n = await store.insert('clientas', { ...datos, creado_por: usuario.nombre, creada_en: new Date().toISOString() });
      D.clientas.push(n);
      return n;
    });
    if (!nueva) return;
    if (cajaDestino) {
      if (!(await confirmar(`¿Asignar la caja <b>${esc(cajaDestino)}</b> a ${esc(nombreCompleto(nueva))}?<br><br>Confirma que <b>ya pagó</b>.`, { titulo: 'Asignar caja', si: 'Sí, ya pagó', no: 'Ahora no' }))) { toast('Clienta registrada'); ir(`clienta/${nueva.id}`); return; }
      const a = await accion(() => asignarCaja(cajaDestino, nueva.id), 'Asignando…');
      if (a) { toast(`Clienta registrada en la caja ${cajaDestino}`); ir(`pedido/${encodeURIComponent(cajaDestino)}`); } else ir(`clienta/${nueva.id}`);
    } else { toast('Clienta registrada'); ir(`clienta/${nueva.id}`); }
  };
}

  };
  const recalcular = () => {
    cats.filter(c => !c.editable).forEach(c => { $(`#sub-${c.id}`).textContent = cant[c.id] ? `${cant[c.id]} × ${dinero(c.precio)} = ${dinero(cant[c.id] * c.precio)}` : ''; });
    const items = armarItems();
    const total = items.reduce((s, i) => s + i.precio * i.cantidad, 0);
    const prendas = items.reduce((s, i) => s + i.cantidad, 0);
    $('#total').textContent = dinero(total);
    $('#total-prendas').textContent = `${prendas} ${prendas === 1 ? 'prenda' : 'prendas'}`;
    return { items, total, prendas };
  };
  const setCant = (cid, n) => { cant[cid] = Math.max(0, Math.floor(Number(n) || 0)); $(`[data-cant="${cid}"]`).value = cant[cid]; recalcular(); };
  $$('[data-mas]').forEach(b => { b.onclick = () => setCant(b.dataset.mas, cant[b.dataset.mas] + 1); });
  $$('[data-menos]').forEach(b => { b.onclick = () => setCant(b.dataset.menos, cant[b.dataset.menos] - 1); });
  $$('[data-cant]').forEach(i => { i.oninput = () => setCant(i.dataset.cant, i.value); i.onfocus = () => i.select(); });
  $$('[data-agregar]').forEach(b => {
    b.onclick = () => { piezas[b.dataset.agregar].push(''); pintarPiezas(b.dataset.agregar); recalcular(); const ins = $$(`[data-pieza="${b.dataset.agregar}"]`); ins[ins.length - 1].focus(); };
  });
  $('#video').onchange = e => {
    video = e.target.files[0] || null;
    if (!video) return;
    const grande = video.size > LIMITE_VIDEO;
    $('#video-vista').innerHTML = `<video src="${URL.createObjectURL(video)}" controls playsinline muted></video>
      <small>${mb(video.size)} MB${grande ? (puedeComprimir() ? ' · se comprimirá antes de subir' : ' · demasiado grande') : ''} · Toca aquí para cambiarlo</small>`;
    $('#zona-video').classList.remove('invalido');
  };
  $('#video-vista').addEventListener('click', e => { if (e.target.tagName === 'VIDEO') e.preventDefault(); });

  $('#guardar').onclick = () => {
    // Sin "await" antes de iniciar la compresión: el iPhone exige que empiece con el toque.
    const { items, total, prendas } = recalcular();
    const sinPrecio = items.filter(i => i.editable && !(i.precio > 0));
    if (!prendas) { toast('Agrega al menos una prenda.', 'error'); return; }
    if (sinPrecio.length) { toast(`Escribe el precio de cada ${sinPrecio[0].nombre.toLowerCase() === 'calzado' ? 'par' : 'pieza'}.`, 'error'); return; }
    if (!video) {
      confirmar('No cargaste el video de la mercancía. El video sirve como respaldo en caso de reclamo.', { titulo: '¿Guardar sin video?', si: 'Guardar sin video', no: 'Cargar video' })
        .then(ok => { if (ok) guardarPedido(null, null); else $('#zona-video').classList.add('invalido'); });
      return;
    }
    let compresion = null;
    if (video.size > LIMITE_VIDEO) {
      if (!puedeComprimir()) { toast(`El video pesa ${mb(video.size)} MB (máximo ${CFG.limiteVideoMB} MB). Graba uno más corto.`, 'error'); return; }
      compresion = comprimirVideo(video, 'subida', p => espera.mostrar('Comprimiendo video…', p), { maxBytes: LIMITE_VIDEO * 0.92 });
    }
    guardarPedido(video, compresion);

    async function guardarPedido(archivo, compresionEnCurso) {
      $('#guardar').disabled = true;
      try {
        let blob = archivo;
        if (compresionEnCurso) {
          espera.mostrar('Comprimiendo video…', 0);
          espera.nota('Tarda lo que dura el video. No cierres la app ni apagues la pantalla.');
          blob = await compresionEnCurso;
          espera.nota('');
          if (blob.size > LIMITE_VIDEO) throw new Error(`El video sigue pesando ${mb(blob.size)} MB. Graba uno más corto.`);
        }
        await refrescar(true);
        const actual = idx.asig(a.id);
        if (!actual || actual.estado !== 'activa') throw new Error('Esta caja cambió (fue enviada o reasignada). Revisa de nuevo.');
        const pid = uid();
        let ruta = null;
        if (blob) {
          ruta = `videos/${pid}.${extensionVideo(blob)}`;
          espera.mostrar('Subiendo video…', 0);
          await store.upload(ruta, blob, p => espera.mostrar('Subiendo video…', p));
        }
        espera.mostrar('Guardando pedido…');
        try {
          await store.insert('pedidos', {
            id: pid, asignacion_id: a.id, clienta_id: a.clienta_id, caja: actual.caja, fecha: new Date().toISOString(),
            items, prendas, total, notas: $('#notas').value.trim(), video: ruta, video_mb: blob ? Number(mb(blob.size)) : null,
            video_comprimido: false, creado_por: usuario.nombre,
          });
        } catch (err) { if (ruta) store.removeFile(ruta).catch(() => {}); throw err; }
        D.cargado = 0;
        espera.ocultar();
        toast(`Pedido guardado: ${dinero(total)}`);
        ir(`caja/${encodeURIComponent(actual.caja)}`);
      } catch (err) {
        console.error(err);
        espera.ocultar();
        toast(traducirError(err), 'error');
        const b = $('#guardar');
        if (b) b.disabled = false;
      }
    }
  };
  recalcular();
}

/* ---------- Reportes y cortes ---------- */
function rangoPeriodo(p, desde, hasta) {
  const hoy = inicioDia(new Date());
  const dia = 864e5;
  if (p === 'hoy') return [hoy, hoy];
  if (p === 'semana') { const lunes = new Date(hoy.getTime() - ((hoy.getDay() + 6) % 7) * dia); return [lunes, hoy]; }
  if (p === 'mes') return [new Date(hoy.getFullYear(), hoy.getMonth(), 1), hoy];
  if (p === 'mesant') return [new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1), new Date(hoy.getFullYear(), hoy.getMonth(), 0)];
  if (p === 'rango' && desde && hasta) return [aFecha(desde), aFecha(hasta)];
  return [new Date(hoy.getFullYear(), hoy.getMonth(), 1), hoy];
}
function enRango(fecha, [ini, fin]) {
  const d = inicioDia(fecha);
  return d >= ini && d <= fin;
}
function calcularReporte(rango) {
  const cats = idx.categorias(true);
  const pedidos = D.pedidos.filter(p => enRango(p.fecha, rango)).sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
  const porCat = {};
  cats.forEach(c => { porCat[c.id] = { nombre: c.nombre, cantidad: 0, importe: 0 }; });
  for (const p of pedidos) for (const it of p.items || []) {
    porCat[it.cat] = porCat[it.cat] || { nombre: it.nombre, cantidad: 0, importe: 0 };
    porCat[it.cat].cantidad += it.cantidad;
    porCat[it.cat].importe += it.precio * it.cantidad;
  }
  const envios = D.asignaciones.filter(a => a.estado === 'enviada' && enRango(a.enviada_en, rango)).sort((a, b) => (a.enviada_en < b.enviada_en ? -1 : 1));
  const r = resumenPedidos(pedidos);
  return {
    pedidos, porCat, envios, total: r.total, prendas: r.prendas,
    clientas: new Set(pedidos.map(p => p.clienta_id)).size,
    nuevas: D.clientas.filter(c => c.fecha_registro && enRango(c.fecha_registro, rango)).length,
    costoEnvios: envios.reduce((s, a) => s + Number(a.costo_envio || 0), 0),
  };
}
